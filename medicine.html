<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青医附院 - 叫号屏</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #2c477e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 模拟屏幕外框 */
        .screen {
            width: 960px;
            height: 560px;
            background-color: #1251a3;
            border: 12px solid #000;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 顶部 Header */
        .header {
            height: 65px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: relative;
        }

        .hospital-logo {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #004299;
        }

        .logo-img {
            height: 40px;        /* 根据界面比例设定的最大高度 */
            width: auto;         /* 宽度自动 */
            max-width: 220px;    /* 限制最大宽度，防止挤压中间的标题 */
            object-fit: contain; /* 保证图形不变形 */
            display: block;
            margin-right: 8px;
        }

        /* 中间蓝底椭圆科室名 */
        .dept-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
            width: 320px;
            height: 55px;
            background-color: #1a62cc;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .time-box {
            display: flex;
            align-items: center;
            color: #004299;
        }

        .date-info {
            text-align: right;
            margin-right: 10px;
            font-size: 12px;
            line-height: 1.3;
        }

        .clock-icon {
            width: 32px;
            height: 32px;
            border: 2px solid #004299;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 8px;
            font-size: 18px;
        }

        .time-text {
            font-size: 28px;
            font-weight: bold;
        }

        /* 主体内容区 */
        .main-content {
            flex: 1;
            display: flex;
            padding: 12px;
            gap: 12px;
            background-color: #0d4694;
        }

        /* 左侧配药中表格 */
        .left-section {
            flex: 2;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        .section-header-blue {
            background-color: #1a62cc;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            letter-spacing: 10px;
        }

        .grid-table {
            flex: 1;
            display: grid;
            grid-template-rows: repeat(6, 1fr);
        }

        .grid-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1.5px solid #1a62cc;
            align-items: center;
        }

        .grid-row:last-child {
            border-bottom: none;
        }

        .grid-cell {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333333;
            border-right: 1px solid #e0e0e0;
        }

        .grid-cell:last-child {
            border-right: none;
        }

        /* 右侧叫号取药区 */
        .right-section {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        .window-header {
            background-color: #1a62cc;
            color: #ffeb3b;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            padding: 14px 0;
            letter-spacing: 2px;
        }

        .sub-header-yellow {
            background-color: #ffeb3b;
            color: #004299;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 6px 0;
            letter-spacing: 1px;
        }

        .call-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px;
        }

        .call-row {
            display: flex;
            justify-content: space-around;
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        /* 底部提示栏 */
        .footer-bar {
            height: 38px;
            background-color: #0f4896;
            border-top: 1px solid #2365bd;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .footer-link {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #ffeb3b;
            text-decoration: underline;
        }

        .yellow-dot {
            width: 10px;
            height: 10px;
            background-color: #ffeb3b;
            border-radius: 50%;
            margin-right: 10px;
        }
  .progress-indicator {
    position: fixed;
   bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.85rem;
    z-index: 9999;
}
    </style>                             <div class="progress-indicator">21/31</div></head>
<body>

<div class="screen">
    <!-- 顶部 -->
    <div class="header">
        <div class="hospital-logo">
            <img src="hospital.png" alt="医院Logo" class="logo-img">

            <div class="date-info">

    <!-- 中间主体 -->
    <div class="main-content">

        <div class="left-section">

            <div class="grid-table">
                <div class="grid-row">
                    <div class="grid-cell">李*</div>

                    <div class="grid-cell">程*飞</div>

                </div>
                <div class="grid-row">
                    <div class="grid-cell">张*心</div>
                    <div class="grid-cell">周*生</div>
                    <div class="grid-cell">唐*君</div>
                    <div class="grid-cell">刘*涛</div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell">刘*伟</div>
                    <div class="grid-cell">李*飞</div>
                    <div class="grid-cell">赵*</div>
                    <div class="grid-cell">程*思</div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell">王*伟</div>
                    <div class="grid-cell">祝*生</div>
                    <div class="grid-cell">周*林</div>
                    <div class="grid-cell">张*江</div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell">陈*</div>
                    <div class="grid-cell">李*纪</div>
                    <div class="grid-cell">钱*军</div>
                    <div class="grid-cell">周*中</div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell">郑*明</div>
                    <div class="grid-cell">吴*江</div>
                    <div class="grid-cell">李*丽</div>
                    <div class="grid-cell">黄*海</div>
                </div>
            </div>
        </div>

        <!-- 右侧：呼叫办理区域 -->
        <div class="right-section">
            <div class="window-header">2 号 诊 室</div>
            <div class="sub-header-yellow">请前往窗口 / 诊室就诊</div>
            <div class="call-list">
                <div class="call-row">
                    <span>张*丽</span>
                    <span>王*伟</span>
                </div>
                <div class="call-row">
                    <span>段宜廷</span>
                    <span>李*敏</span>
                </div>
                <div class="call-row">
                    <span>刘*伟</span>
                    <span>林*平</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部消息提示 -->
 <div class="footer-bar">
    <a href="hospital.html" class="footer-link" target="_blank">
        <div class="yellow-dot"></div>
        现已开通线上就诊记录查询服务，凭个人信息即可查询历史就诊记录。
    </a>
</div>
</div>

</body>
</html>
