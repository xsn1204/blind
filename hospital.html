<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>病历档案验证 - 青医附院</title>
    <style>
        body {
            font-family: "Microsoft YaHei", SimSun, "黑体", SimHei;
            font-size: 14px;
            line-height: 1.8;
            background-color: #f5f5f5;
            margin: 0;
            color: #333;
            padding: 20px;
        }
        .auth-container {
            width: 500px;
            margin: 100px auto;
            background-color: #fff;
            padding: 40px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 8px #ddd;
            border-radius: 5px;
            text-align: center;
        }
        .auth-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #222;
            border-bottom: 1px solid #ccc;
            padding-bottom: 15px;
        }
        .auth-form {
            margin-bottom: 20px;
        }
        .form-item {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-item input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-item input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 3px #b3d1ff;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: #fff;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .auth-btn:hover {
            background-color: #0052a3;
        }
        .error-tip {
            color: #d9534f;
            margin-top: 10px;
            display: none;
        }
        .hospital-logo {
            text-align: center;
            margin-bottom: 10px;
        }
        .hospital-logo img {
            width: 180px;
            height: 190px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }
        .hospital-name {
            font-size: 16px;
            font-weight: bold;
            margin-top: 0;
            color: #222;
            word-wrap: break-word;
            width: 90%;
            margin: 0 auto;
        }
     .progress-indicator {
    position: fixed;
   bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.85rem;
    z-index: 9999;
}
    </style>                             <div class="progress-indicator">22/31</div></head>
<body>
    <div class="auth-container" id="authBox">
        <div class="hospital-logo">
            <img src="hospital.png" alt="青医附院标识" title="青医附院标识">
            <div class="hospital-name">青州医科大学第一附属医院</div>
        </div>
        <div class="auth-title">病历档案验证</div>
        <div class="auth-form">
            <div class="form-item">
                <label for="birthYear">出生年份</label>
                <input type="number" id="birthYear" placeholder="例如：2000" min="1900" max="2026">
            </div>
            <div class="form-item">
                <label for="birthMonth">出生月份</label>
                <input type="number" id="birthMonth" placeholder="例如：01" min="1" max="12">
            </div>
            <div class="form-item">
                <label for="birthDay">出生日期</label>
                <input type="number" id="birthDay" placeholder="例如：01" min="1" max="31">
            </div>
            <button class="auth-btn" onclick="verifyBirthday()">验证</button>
            <div class="error-tip" id="errorTip">404：查无此人</div>
        </div>
        <p style="font-size: 12px; color: #666;">© 青医附院 版权所有 | 医疗信息管理</p>
    </div>

    <script>
        const correctBirth = {
            year: 2002,
            month: 11,
            day: 11
        };

        function verifyBirthday() {
            const year = parseInt(document.getElementById('birthYear').value);
            const month = parseInt(document.getElementById('birthMonth').value);
            const day = parseInt(document.getElementById('birthDay').value);
            const errorTip = document.getElementById('errorTip');
            
            errorTip.style.display = 'none';

        if (isNaN(year) || isNaN(month) || isNaN(day)) {
    errorTip.textContent = '请输入有效的年月日！';
    errorTip.style.display = 'block';
    return;
}

if (year === correctBirth.year && month === correctBirth.month && day === correctBirth.day) {
    // 验证成功，在新标签页打开病历详情页
    window.open('report.html', '_blank');
} else {
    errorTip.style.display = 'block';
}
}


        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                verifyBirthday();
            }
        });
    </script>
</body>
</html>
