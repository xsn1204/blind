<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青州大学 - 校友名录</title>
    <style>
        :root {
            --qz-blue: #004c99; 
            --qz-gold: #c39d67;
            --text-dark: #333;
            --text-light: #fff;
            --bg-light: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            line-height: 1.8;
            color: var(--text-dark);
            background-color: var(--bg-light);
            font-size: 16px;
            position: relative;
            min-height: 100vh;
        }

        /* 锁屏禁用交互样式 */
        body.locked {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .btn-search-adv.disabled {
            background: #a0b2c6 !important;
            color: #e0e8f0 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            opacity: 0.7;
        }

        /* --- 主导航栏 --- */
        .navbar {
            background-color: var(--qz-blue);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nav-list {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            margin: 0 auto;
            max-width: 1400px;
        }

        .nav-list a {
            display: block;
            padding: 15px 25px;
            color: var(--text-light);
            font-size: 1.1em;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .nav-list a:hover, .nav-list a.active {
            background-color: var(--qz-gold);
            color: var(--text-dark);
        }
        
        /* --- 页头结构 --- */
        .page-header {
            background-color: var(--qz-blue);
            color: var(--text-light);
            padding: 45px 0;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--qz-gold);
        }
        .page-header h1 {
            font-size: 2.2em;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .page-header p {
            font-size: 1.05em;
            color: #d0e1f9;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        
        /* --- 主体内容布局 --- */
        .main-container {
            width: 80%;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 2;
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
        }

        .sidebar {
            flex: 0 0 220px;
            padding-top: 10px;
        }

        .sidebar ul {
            list-style: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .sidebar a {
            display: block;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 0.95em;
            color: var(--text-dark);
            text-decoration: none;
        }
        
        .sidebar a:hover, .sidebar .active {
            background-color: #f0f7ff;
            color: var(--qz-blue);
            font-weight: 600;
        }
        .sidebar .active {
            border-left: 4px solid var(--qz-blue);
            padding-left: 11px;
        }

        .main-content-body {
            flex: 1;
        }

        .section-title {
            font-size: 1.5em;
            color: var(--qz-blue);
            border-bottom: 2px solid var(--qz-blue);
            padding-bottom: 8px;
            margin-top: 10px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* --- 搜索卡片样式 --- */
        .filter-card-advanced {
            background: linear-gradient(135deg, #f8fbff 0%, #edf4fc 100%);
            border: 1px solid #cce0f5;
            border-radius: 10px;
            padding: 28px 30px;
            margin-bottom: 30px;
            box-shadow: 0 6px 18px rgba(0, 76, 153, 0.06);
            position: relative;
        }

        .filter-header-title {
            font-size: 1.05em;
            font-weight: 700;
            color: var(--qz-blue);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-header-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: var(--qz-gold);
            border-radius: 2px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px 24px;
            margin-bottom: 22px;
        }

        .form-group-adv {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group-adv label {
            font-size: 0.9em;
            font-weight: 600;
            color: #445566;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper svg {
            position: absolute;
            left: 12px;
            width: 16px;
            height: 16px;
            fill: #88a0b8;
            transition: fill 0.3s;
        }

        .form-control-adv {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: 1px solid #c4d8ec;
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            background-color: #ffffff;
            color: #222;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .form-control-adv.no-icon {
            padding-left: 14px;
        }

        .form-control-adv:focus {
            border-color: var(--qz-blue);
            box-shadow: 0 0 0 3px rgba(0, 76, 153, 0.15);
            background-color: #fff;
        }

        .filter-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #dce8f5;
            padding-top: 18px;
        }

        .btn-search-adv {
            background: linear-gradient(180deg, #005bb5 0%, #003f80 100%);
            color: white;
            border: none;
            padding: 10px 32px;
            font-size: 0.95em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 76, 153, 0.25);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search-adv:hover {
            background: linear-gradient(180deg, #006bd6 0%, #004c99 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 76, 153, 0.35);
        }

        .btn-reset-adv {
            background-color: #ffffff;
            color: #556677;
            border: 1px solid #c4d8ec;
            padding: 10px 20px;
            font-size: 0.95em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        /* --- 结果显示区 --- */
        .result-container {
            display: none;
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ccc;
        }

        .result-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #222;
        }

        .result-count {
            color: #666;
            font-size: 0.9em;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .data-table th, .data-table td {
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            text-align: left;
        }

        .data-table th {
            background-color: #f5f5f5;
            color: var(--qz-blue);
            font-weight: bold;
        }

        .data-table tr:nth-child(even) {
            background-color: #fafafa;
        }

        .empty-tip {
            display: none;
            text-align: center;
            padding: 40px 20px;
            color: #d9534f;
            font-size: 1.1em;
            font-weight: bold;
            background-color: #fdf7f7;
            border: 1px dashed #d9534f;
            border-radius: 4px;
            margin-top: 20px;
        }

        /* 柔和深红 404 喷刷层 */
        .popup-404-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }

        .popup-number {
            position: absolute;
            color: #c0392b; /* 调暗红色，更加深沉不刺眼 */
            font-weight: 800;
            font-family: Impact, "Arial Black", sans-serif;
            user-select: none;
            white-space: nowrap;
            transform: scale(0);
            animation: popInChaotic 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 6px rgba(192, 57, 43, 0.3);
            line-height: 1;
        }

        @keyframes popInChaotic {
            to {
                transform: var(--target-transform, scale(1));
            }
        }

        /* 全屏极缓黑屏过渡层 */
        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 8, 18, 1);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dark-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ethereal-text {
            font-style: italic;
            font-family: "STKaiti", "Kaiti", "PingFang SC", serif;
            font-size: 1.7em;
            letter-spacing: 6px;
            padding-right: 8px;
            border-right: 2px solid rgba(226, 241, 255, 0.8);
            white-space: nowrap;
            animation: cursorBlink 0.9s infinite alternate;
            background: linear-gradient(135deg, #ffffff 0%, #b8dcff 50%, #f3d1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(186, 215, 255, 0.6));
        }

        @keyframes cursorBlink {
            from { border-color: rgba(226, 241, 255, 0.8); }
            to { border-color: transparent; }
        }

        /* 页脚 */
        .footer {
            background-color: #333;
            color: #ccc;
            padding: 25px;
            text-align: center;
            font-size: 0.85em;
            margin-top: 40px;
        }

        .progress-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            z-index: 9999;
        }

        /* 关键签名（默认隐藏，动画后期出现） */
        .floating-signature {
            position: fixed;
            right: 48px;
            bottom: 36px;
            width: 200px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease, visibility 1.5s ease;
            z-index: 10001; /* 确保置于暗屏层之上 */
        }
        
        .floating-signature.show {
            opacity: 0.85;
            visibility: visible;
        }

        .floating-signature:hover { opacity: 1; }
        .floating-signature img { width: 100%; display: block; }
    </style>
</head>
<body>
    <div class="floating-signature" id="signatureBox">
        <img src="signature.jpg" alt="关键签名">
    </div>
    
    <div class="progress-indicator">5/31</div>

    <!-- 弹窗容器 -->
    <div id="popupContainer" class="popup-404-container"></div>

    <!-- 暗屏全屏遮罩及特效文本容器 -->
    <div id="darkOverlay" class="dark-overlay">
        <div id="typewriterText" class="ethereal-text"></div>
    </div>

    <!-- 主导航栏 -->
    <nav class="navbar" id="navbar">
        <ul class="nav-list">
            <li><a href="#">首页</a></li>
            <li><a href="#">学校概况</a></li>
            <li><a href="#" class="active">人才培养</a></li>
            <li><a href="#">科学研究</a></li>
            <li><a href="#">招生就业</a></li>
            <li><a href="#">国际交流</a></li>
            <li><a href="#">机构设置</a></li>
            <li><a href="#">公共服务</a></li>
        </ul>
    </nav>

    <!-- 页头结构 -->
    <div class="page-header" id="pageHeader">
        <h1>校友名录</h1>
        <p>QINGZHOU UNIVERSITY ALUMNI DIRECTORY</p>
    </div>

    <!-- 主体内容布局 -->
    <div class="main-container" id="mainContainer">
        <div class="content-wrapper">
            <div class="sidebar">
                <ul>
                    <li><a href="#">教学动态</a></li>
                    <li><a href="#">师资队伍</a></li>
                             <li><a href="#">创新创业</a></li>
                    <li><a href="#">职业培训</a></li>
                    <li><a href="#" class="active">校友名录</a></li>
                </ul>
            </div>

            <div class="main-content-body">
                <h2 class="section-title">医学部校友名录检索</h2>
                
                <div class="filter-card-advanced">
                    <div class="filter-header-title">校友信息精准检索系统</div>
                    
                    <form id="searchForm" onsubmit="handleSearch(event)">
                        <div class="filter-grid">
                            <div class="form-group-adv">
                                <label for="nameInput">姓名检索</label>
                                <div class="input-wrapper">
                                    <input type="text" id="nameInput" class="form-control-adv" placeholder="请输入校友姓名..." required autocomplete="off">
                                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                </div>
                            </div>

                            <div class="form-group-adv">
                                <label for="yearSelect">入校年份</label>
                                <div class="input-wrapper">
                                    <select id="yearSelect" class="form-control-adv no-icon">
                                        <option value="">全部年份</option>
                                        <option value="2018">2018 年</option>
                                        <option value="2019">2019 年</option>
                                        <option value="2020">2020 年</option>
                                        <option value="2021">2021 年</option>
                                        <option value="2022">2022 年</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="filter-actions">
                            <button type="button" class="btn-reset-adv" onclick="resetForm()">重置条件</button>
                            <button type="submit" class="btn-search-adv">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 11.99 14 9.5 14z"/></svg>
                                立即查询
                            </button>
                        </div>
                    </form>
                </div>

                <div id="resultBox" class="result-container">
                    <div class="result-header">
                        <span class="result-title" id="resultTitle">校友检索结果</span>
                        <span class="result-count" id="resultCount">共查询到 <b>1</b> 名学员</span>
                    </div>

                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>入学年份</th>
                                <th>专业方向</th>
                            </tr>
                        </thead>
                        <tbody id="alumniTableBody">
                        </tbody>
                    </table>
                </div>

                <div id="emptyTip" class="empty-tip">
                    【404：查无此人】
                </div>
            </div>
        </div>
    </div>

    <footer class="footer" id="pageFooter">
        青州大学医学部招生办公室 · 拔尖创新人才培养中心 | 临ICP备 19000001号-1
    </footer>

    <script>
        const alumniDatabase = [
            { name: '林浩然', year: '2020年', major: '基础医学（青州市第一中学）' },
            { name: '陈思语', year: '2020年', major: '预防医学（青州市第八中学）' },
            { name: '许泽宇', year: '2020年', major: '生物医学工程（青州外国语学校）' },
            { name: '周扬', year: '2020年', major: '药学创新班（青州育才中学）' }
        ];

        function handleSearch(event) {
            event.preventDefault();

            const name = document.getElementById('nameInput').value.trim();
            const year = document.getElementById('yearSelect').value;
            const resultBox = document.getElementById('resultBox');
            const emptyTip = document.getElementById('emptyTip');
            const tableBody = document.getElementById('alumniTableBody');
            const resultCount = document.getElementById('resultCount');

            resultBox.style.display = 'none';
            emptyTip.style.display = 'none';

            // 特殊匹配逻辑：2020 + 顾思佳
            if (year === '2020' && name === '顾思佳') {
                // 1. 立刻禁用页面文本选中 & 查询按钮置灰
                document.body.classList.add('locked');
                const searchBtn = document.querySelector('.btn-search-adv');
                if (searchBtn) {
                    searchBtn.disabled = true;
                    searchBtn.classList.add('disabled');
                }

                const container = document.getElementById('popupContainer');
                container.innerHTML = '';
                document.getElementById('signatureBox').classList.remove('show');

                // 2. 点击搜索后先静默等待 2 秒，再开始喷刷 404
                setTimeout(() => {
                    const baseWidth = 80;
                    const baseHeight = 50;
                    const cols = Math.ceil(window.innerWidth / baseWidth) + 2;
                    const rows = Math.ceil(window.innerHeight / baseHeight) + 2;
                    
                    let basePoints = [];
                    for (let r = -1; r < rows; r++) {
                        for (let c = -1; c < cols; c++) {
                            basePoints.push({
                                x: c * baseWidth,
                                y: r * baseHeight
                            });
                        }
                    }

                    basePoints.sort(() => Math.random() - 0.5);

                    let currentIdx = 0;
                    // 由慢到快：初始延迟 350ms，逐渐加速
                    let delay = 350;

                    function spawnRedNumbers() {
                        if (currentIdx >= basePoints.length) {
                            // 铺满全屏后，暗屏过渡
                            setTimeout(() => {
                                const darkOverlay = document.getElementById('darkOverlay');
                                darkOverlay.classList.add('active');

                                setTimeout(() => {
                                    container.innerHTML = ''; // 清除底层 404
                                    setTimeout(() => {
                                        startTypewriting();
                                    }, 2000);
                                }, 3500);
                            }, 200);
                            return;
                        }

                        const point = basePoints[currentIdx];
                        const num = document.createElement('div');
                        num.className = 'popup-number';
                        num.innerText = 'ERROR 404';

                        const randomOffsetX = (Math.random() - 0.5) * 50;
                        const randomOffsetY = (Math.random() - 0.5) * 40;
                        const rotateDeg = (Math.random() - 0.5) * 60;
                        // 缩小字体：1.4rem ~ 2.8rem
                        const fontSize = 1.4 + Math.random() * 1.4;

                        num.style.left = (point.x + randomOffsetX) + 'px';
                        num.style.top = (point.y + randomOffsetY) + 'px';
                        num.style.fontSize = fontSize + 'rem';
                        num.style.zIndex = Math.floor(Math.random() * 1000);
                        num.style.setProperty('--target-transform', `rotate(${rotateDeg}deg)`);

                        container.appendChild(num);
                        currentIdx++;

                        // 逐渐加快间隔时间（最低降至 3ms）
                        delay = Math.max(3, delay * 0.85);
                        setTimeout(spawnRedNumbers, delay);
                    }

                    spawnRedNumbers();
                }, 2000); // 搜索后延迟 2s 启动

                return;
            }

            // 普通校友匹配
            const matched = alumniDatabase.filter(item => item.name === name);
            if (matched.length > 0) {
                tableBody.innerHTML = matched.map((item, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b>${item.name}</b></td>
                        <td>${item.year}</td>
                        <td>${item.major}</td>
                    </tr>
                `).join('');
                resultCount.innerHTML = `共查询到 <b>${matched.length}</b> 名学员`;
                resultBox.style.display = 'block';
            } else {
                emptyTip.style.display = 'block';
                emptyTip.innerText = '【404：查无此人】';
            }
        }

        // 打字逻辑与签名延迟控制
        function startTypewriting() {
            const textContainer = document.getElementById('typewriterText');
            textContainer.innerText = '';

            const part1 = '或许';
            const part2 = '你在找的是：';
            const slowText = '杜鹃花？';

            let p1Index = 0;
            let p2Index = 0;
            let sIndex = 0;

            // 打第一部分：“或许”
            const p1Interval = setInterval(() => {
                if (p1Index < part1.length) {
                    textContainer.innerText += part1.charAt(p1Index);
                    p1Index++;
                } else {
                    clearInterval(p1Interval);

                    // “或许” 打完后停顿 600ms
                    setTimeout(() => {
                        // 打第二部分：“你在找的是：”
                        const p2Interval = setInterval(() => {
                            if (p2Index < part2.length) {
                                textContainer.innerText += part2.charAt(p2Index);
                                p2Index++;
                            } else {
                                clearInterval(p2Interval);

                                // “你在找的是：” 打完后停顿 800ms
                                setTimeout(() => {
                                    // 打第三部分：“杜鹃花？”（慢速）
                                    const slowInterval = setInterval(() => {
                                        if (sIndex < slowText.length) {
                                            textContainer.innerText += slowText.charAt(sIndex);
                                            sIndex++;
                                        } else {
                                            clearInterval(slowInterval);

                                            // 打印完成后 3 秒显示关键签名
                                            setTimeout(() => {
                                                document.getElementById('signatureBox').classList.add('show');
                                            }, 3000);
                                        }
                                    }, 800);
                                }, 800);
                            }
                        }, 130);
                    }, 600);
                }
            }, 130);
        }

        function resetForm() {
            document.getElementById('searchForm').reset();
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('emptyTip').style.display = 'none';

            // 解除锁屏与按钮置灰
            document.body.classList.remove('locked');
            const searchBtn = document.querySelector('.btn-search-adv');
            if (searchBtn) {
                searchBtn.disabled = false;
                searchBtn.classList.remove('disabled');
            }

            const container = document.getElementById('popupContainer');
            container.innerHTML = '';

            const darkOverlay = document.getElementById('darkOverlay');
            darkOverlay.classList.remove('active');
            document.getElementById('typewriterText').innerText = '';
            document.getElementById('signatureBox').classList.remove('show');
        }
    </script>
</body>
</html>
