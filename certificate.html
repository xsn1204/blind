<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣誉证书 - 三（4）班</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "SimSun", "Songti SC", "STSong", serif;
            padding: 20px;
        }

        /* 证书外边框容器 */
        .certificate-container {
            width: 800px;
            height: 560px;
            background-color: #fdfcf7;
            border: 12px solid #9c7143;
            outline: 3px solid #6b4a2b;
            outline-offset: -8px;
            padding: 15px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* 双重精细内边框 */
        .certificate-inner {
            width: 100%;
            height: 100%;
            border: 2px solid #9c7143;
            padding: 20px 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10px 10px, rgba(156, 113, 67, 0.05) 2px, transparent 0);
            background-size: 20px 20px;
        }

        /* 四角花纹装饰 */
        .corner-decoration {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 3px solid #9c7143;
        }
        .top-left { top: 5px; left: 5px; border-right: none; border-bottom: none; }
        .top-right { top: 5px; right: 5px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 5px; left: 5px; border-right: none; border-top: none; }
        .bottom-right { bottom: 5px; right: 5px; border-left: none; border-top: none; }

        /* 证书头部标题 */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .title-cn {
            font-size: 42px;
            font-weight: bold;
            color: #cc1111;
            letter-spacing: 12px;
            font-family: "SimHei", "STHeiti", sans-serif;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
        }

        .title-en {
            font-size: 13px;
            color: #cc1111;
            letter-spacing: 2px;
            font-weight: bold;
            margin-top: 2px;
            font-family: "Times New Roman", serif;
        }

        .divider {
            width: 80px;
            height: 2px;
            background-color: #cc1111;
            margin: 6px auto 0 auto;
        }

        /* 证书主体文字 */
        .content {
            width: 100%;
            margin-top: 15px;
            font-size: 21px;
            line-height: 2.2;
            color: #111;
        }

        .recipient {
            font-size: 24px;
            font-weight: bold;
            border-bottom: 2px solid #111;
            padding: 0 15px 2px 15px;
            display: inline-block;
            margin-right: 5px;
        }

        .award-text {
            text-indent: 2em;
            text-align: justify;
        }

        .award-name {
            font-family: "Kaiti", "STKaiti", "楷体", serif;
            font-size: 38px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: #000;
            letter-spacing: 4px;
        }

        .footer-text {
            text-indent: 2em;
        }

        /* 盖章及落款区域 */
        .seal-area {
            position: absolute;
            bottom: 35px;
            right: 60px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid rgba(220, 20, 60, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(220, 20, 60, 0.7);
            font-size: 13px;
            font-weight: bold;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .seal-inner {
            width: 118px;
            height: 118px;
            border: 1px solid rgba(220, 20, 60, 0.7);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
        }

        .seal-star {
            font-size: 18px;
            margin: 2px 0;
        }

        @media print {
            body { background: none; padding: 0; }
            .certificate-container { box-shadow: none; }
        }

                            .progress-indicator {
    position: fixed;
   bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.85rem;
    z-index: 9999;
}
    </style>                             <div class="progress-indicator">18/38</div></head>
<body>

<div class="certificate-container">
    <div class="certificate-inner">
        <!-- 四角花纹 -->
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <!-- 标题 -->
        <div class="header">
            <div class="title-cn">荣誉证书</div>
            <div class="title-en">CERTIFICATE OF HONOR</div>
            <div class="divider"></div>
        </div>

        <!-- 主体内容 -->
        <div class="content">
            <div>
                <span class="recipient">宋以宁（xxx团队）</span>：
            </div>
            <div class="award-text">
                在青州大学附属高中第十一届生活节之【秋日拾光】活动中，表现突出，荣获
            </div>
            <div class="award-name">
                “最具爱心奖”
            </div>
            <div class="footer-text">
                特发此证，以资鼓励。
            </div>
        </div>

        <!-- 模拟公章 -->
        <div class="seal-area">
            <div class="seal-inner">
                <div>青州大学附属高中</div>
                <div class="seal-star">★</div>
                <div>活动组委会</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
