<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Outlook - 加密即时沟通</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f3f2f1;
            user-select: none;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c8c6c4;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a19f9d;
        }

        /* Typing Dots Animation */
        .typing-dot {
            animation: typingAnimation 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }

        /* Message Bubble Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(12px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop-in {
            animation: popIn 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        /* Custom Speech Bubble Tails */
        .bubble-left::before {
            content: "";
            position: absolute;
            top: 10px;
            left: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 10px 10px 0;
            border-color: transparent #ffffff transparent transparent;
        }
        .bubble-right::before {
            content: "";
            position: absolute;
            top: 10px;
            right: -8px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 10px 0 0;
            border-color: #0078d4 transparent transparent transparent;
        }
 .progress-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            z-index: 9999;
        }
    </style>
    <div class="progress-indicator">finalX3️⃣/31</div>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#f3f2f1]">

<!-- Top Title Bar / Search Bar (Outlook 365 style) -->
<header class="h-12 bg-[#0078d4] text-white flex items-center justify-between px-3 shrink-0 shadow-sm">
    <div class="flex items-center gap-3 w-64">
        <button class="p-1.5 hover:bg-[#005a9e] rounded transition"><i class="fa-solid fa-bars text-lg"></i></button>
        <div class="flex items-center gap-2 font-semibold text-base tracking-wide">
            <i class="fa-regular fa-envelope text-xl"></i>
            <span>Outlook</span>
        </div>
    </div>

    <!-- Universal Search Bar -->
    <div class="flex-1 max-w-2xl mx-4">
        <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-[#0078d4]"></i>
            <input type="text" value="" readonly 
                   class="w-full bg-white text-gray-800 text-sm pl-9 pr-8 py-1.5 rounded-md focus:outline-none shadow-inner">
            <i class="fa-solid fa-sliders absolute right-3 text-gray-400 cursor-pointer hover:text-gray-600"></i>
        </div>
    </div>

    <!-- Header Right Actions -->
    <div class="flex items-center gap-3 text-sm">
        <button class="hover:bg-[#005a9e] p-2 rounded-full transition" title="Teams 会议"><i class="fa-solid fa-video"></i></button>
        <button class="hover:bg-[#005a9e] p-2 rounded-full transition" title="通知"><i class="fa-regular fa-bell"></i></button>
        <button class="hover:bg-[#005a9e] p-2 rounded-full transition" title="设置"><i class="fa-solid fa-gear"></i></button>
        <div class="h-7 w-7 rounded-full bg-amber-600 text-white flex items-center justify-center font-semibold border-2 border-white text-xs shadow">
            X4
        </div>
    </div>
</header>

<div class="flex-1 flex overflow-hidden">
    
    <!-- Left Navigation Bar (Mail, Calendar, Contacts, Teams Chat) -->
    <nav class="w-12 bg-[#f3f2f1] border-r border-[#e1dfdd] flex flex-col items-center py-2 gap-4 shrink-0 text-[#605e5c]">
        <button class="p-2 hover:bg-[#edebe9] text-[#605e5c] rounded transition"><i class="fa-regular fa-envelope text-lg"></i></button>
        <button class="p-2 hover:bg-[#edebe9] text-[#605e5c] rounded transition"><i class="fa-regular fa-calendar text-lg"></i></button>
        <button class="p-2 hover:bg-[#edebe9] text-[#605e5c] rounded transition"><i class="fa-regular fa-address-book text-lg"></i></button>
        <!-- Active Tab: Embedded Encryption Chat -->
        <button class="p-2 bg-white text-[#0078d4] shadow-sm rounded-md transition relative">
            <i class="fa-regular fa-comments text-lg"></i>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <div class="mt-auto flex flex-col gap-3">
            <button class="p-2 hover:bg-[#edebe9] rounded text-gray-500"><i class="fa-solid fa-check-double text-base"></i></button>
        </div>
    </nav>

    <!-- Message Folders & Thread List Pane -->
    <div class="w-80 bg-white border-r border-[#e1dfdd] flex flex-col shrink-0">
        <!-- List Header -->
        <div class="p-3 border-b border-[#f3f2f1] flex justify-between items-center bg-gray-50">
            <div class="font-semibold text-gray-700 text-sm flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-[#0078d4]"></i> 加密会话 (Teams/Outlook)
            </div>
            <button class="text-xs text-[#0078d4] font-medium hover:underline">全部已读</button>
        </div>

        <!-- Chat Conversations List -->
        <div class="flex-1 overflow-y-auto">
            <!-- Active Selected Thread -->
            <div class="p-3 bg-[#eff6fc] border-l-4 border-[#0078d4] cursor-pointer flex gap-3 hover:bg-[#e5f1fb] transition">
                <div class="relative shrink-0">
                    <div class="w-10 h-10 rounded-full bg-slate-700 text-white font-bold flex items-center justify-center text-sm shadow-sm">
                        张
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-baseline mb-0.5">
                        <span class="font-semibold text-xs text-gray-900 truncate">张律师 (盛廷案法律顾问)</span>
                        <span class="text-[10px] text-gray-400">23:18</span>
                    </div>
                    <div class="text-xs text-gray-600 font-medium truncate mb-1">案件调查进度确认</div>
                    <p class="text-[11px] text-gray-400 truncate" id="threadPreview">张律师，关于盛廷医药的案子，我已经……</p>
                </div>
            </div>

            <!-- Inactive Dummy Threads for Visual Realism -->
            <div class="p-3 border-b border-gray-100 cursor-pointer flex gap-3 hover:bg-gray-50 transition opacity-60">
                <div class="w-10 h-10 rounded-full bg-indigo-700 text-white font-bold flex items-center justify-center text-sm">
                    安
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-baseline mb-0.5">
                        <span class="font-medium text-xs text-gray-800">安全信道节点X</span>
                        <span class="text-[10px] text-gray-400">9月14日</span>
                    </div>
                    <div class="text-xs text-gray-500 truncate">密钥重置通知：终端自动更新成功</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Reading Pane / Chat Canvas -->
    <main class="flex-1 flex flex-col bg-[#f5f7f9] relative overflow-hidden">
        
        <!-- Thread Ribbon / Toolbar Header -->
        <div class="h-14 bg-white border-b border-[#e1dfdd] px-6 flex justify-between items-center shrink-0 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-slate-700 text-white font-bold flex items-center justify-center text-sm">
                    张
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-sm text-gray-800">张律师</h2>
                    </div>
                    <p class="text-[11px] text-gray-500">主题: 案件调查进度确认</p>
                </div>
            </div>

            <!-- Header Right Status Badge -->
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    加密会话进行中
                </span>
            </div>
        </div>

        <!-- Chat Bubble Viewport -->
        <div id="chatViewport" class="flex-1 overflow-y-auto p-6 space-y-4 bg-[#f0f4f8]">
            
            <!-- Security / Date Stamp Banner -->
            <div class="flex justify-center my-2">
                <span class="bg-gray-200 text-gray-600 text-[11px] px-3 py-1 rounded-full shadow-inner flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-gray-500 text-[10px]"></i>
                    端到端加密通道已建立 · 2026年9月15日 下午 23:16
                </span>
            </div>

            <!-- Dynamic Messages will be injected here -->
            <div id="messageFeed" class="space-y-4"></div>

            <!-- Animated Typing Indicator Container -->
            <div id="typingIndicator" class="hidden flex items-end gap-2.5 max-w-lg animate-pop-in">
                <div class="w-8 h-8 rounded-full bg-slate-700 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow">
                    张
                </div>
                <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-none px-4 py-3 shadow-sm relative bubble-left flex items-center gap-2">
                    <span class="text-xs text-gray-500 font-medium">张律师 正在输入</span>
                    <div class="flex gap-1 items-center">
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full typing-dot"></span>
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full typing-dot"></span>
                        <span class="w-1.5 h-1.5 bg-blue-500 rounded-full typing-dot"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Outlook/Teams Styled Bottom Action Bar (Read-only for simulation) -->
        <div class="p-4 bg-white border-t border-[#e1dfdd] flex items-center gap-3 shrink-0">
            <button class="text-gray-400 hover:text-gray-600 p-1.5"><i class="fa-solid fa-paperclip text-lg"></i></button>
            <div class="flex-1 relative">
                <input type="text" placeholder="对方已将会话状态更改为 [已归档]..." disabled 
                       class="w-full bg-gray-100 text-gray-500 text-xs px-4 py-2.5 rounded-lg border border-gray-200 cursor-not-allowed">
            </div>
            <button disabled class="bg-gray-300 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-not-allowed flex items-center gap-1">
                <span>发送</span>
                <i class="fa-solid fa-paper-plane text-[10px]"></i>
            </button>
        </div>
    </main>
</div>

<script>
    // Sequence Data Definition
    const conversationScript = [
        {
            id: 1,
            sender: "detective",
            name: "侦探X404",
            text: "张律师，关于盛廷医药的案子，我已经查出幕后主使是谁了……只是，我不确定您和您的客户能不能接受这个结果。这个人就是——",
            time: "23:16",
            delay: 2000
        },
        {
            id: 2,
            sender: "lawyer",
            name: "张律师",
            text: "不必了，侦探。",
            time: "23:16",
            typingTime: 3600,
            delay: 2400
        },
        {
            id: 3,
            sender: "detective",
            name: "侦探X404",
            text: "什么？",
            time: "23:17",
            delay: 2000
        },
        {
            id: 4,
            sender: "lawyer",
            name: "张律师",
            text: "这次合作虽然没有达成，但我们还是按照80%给您结算。",
            time: "23:17",
            typingTime: 4400,
            delay: 2800
        },
        {
            id: 5,
            sender: "detective",
            name: "侦探X404",
            text: "这倒也不是不行……但我已经用最快的速度在调查了，居然还是有同行更卷吗？",
            time: "23:17",
            delay: 3000
        },
        {
            id: 6,
            sender: "lawyer",
            name: "张律师",
            text: "确实，您还是慢了一步。",
            time: "23:18",
            typingTime: 3200,
            delay: 2400
        },
        {
            id: 7,
            sender: "detective",
            name: "侦探X404",
            text: "？是谁？",
            time: "23:18",
            delay: 2000
        },
        {
            id: 8,
            sender: "lawyer",
            name: "张律师",
            text: "是我们的客户。",
            time: "23:18",
            typingTime: 5600,
            delay: 3000
        },
                {
            id: 9,
            sender: "lawyer",
            name: "张律师",
            text: "他说他已经想明白了，刚刚提交了撤诉。",
            time: "23:18",
            typingTime: 2600,
            delay: 1000
},
                {
            id: 10,
            sender: "lawyer",
            name: "张律师",
            text: "好在，我们也收到了，80%的服务费🙏",
            time: "23:18",
            typingTime: 2600,
            delay: 2000
        },
                {
            id: 11,
            sender: "detective",
            name: "侦探X404",
            text: "原来如此，真是个不错的结局啊。",
            time: "23:19",
            delay: 3000
        },

                        {
            id: 12,
            sender: "detective",
            name: "侦探X404",
            text: "张律师，合作愉快。下一案请务必还要叫上我。",
            time: "23:19",
            delay: 3000
        },
                {
            id: 13,
            sender: "lawyer",
            name: "张律师",
            text: "合作愉快🤝",
            time: "23:19",
            typingTime: 2600,
            delay: 2000
        },
        
        

    ];

    // State Variables
    let currentStep = 0;
    let timeoutId = null;

    const messageFeed = document.getElementById('messageFeed');
    const typingIndicator = document.getElementById('typingIndicator');
    const chatViewport = document.getElementById('chatViewport');
    const threadPreview = document.getElementById('threadPreview');

    // Utility: Scroll Viewport to Bottom
    function scrollToBottom() {
        chatViewport.scrollTo({
            top: chatViewport.scrollHeight,
            behavior: 'smooth'
        });
    }

    // Render Single Message Bubble
    function appendMessage(item) {
        const isDetective = item.sender === "detective";
        const messageWrapper = document.createElement('div');
        messageWrapper.className = `flex gap-2.5 max-w-xl animate-pop-in ${isDetective ? 'ml-auto flex-row-reverse' : ''}`;

        if (isDetective) {
            // Detective Message Bubble
            messageWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow">
                    X4
                </div>
                <div class="relative bg-[#0078d4] text-white rounded-2xl rounded-br-none px-4 py-2.5 shadow-md bubble-right">
                    <div class="text-[11px] text-blue-100 font-semibold mb-0.5 text-right">我 (侦探X404)</div>
                    <p class="text-xs leading-relaxed font-normal select-text">${item.text}</p>
                    <div class="flex items-center justify-end gap-1 mt-1 text-[10px] text-blue-200">
                        <span>${item.time}</span>
                        <i class="fa-solid fa-check-double text-[10px] text-sky-200" title="已送达并阅读"></i>
                    </div>
                </div>
            `;
        } else {
            // Lawyer Message Bubble
            messageWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-slate-700 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow">
                    张
                </div>
                <div class="relative bg-white border border-gray-200 text-gray-800 rounded-2xl rounded-bl-none px-4 py-2.5 shadow-sm bubble-left">
                    <div class="text-[11px] text-gray-500 font-semibold mb-0.5">张律师</div>
                    <p class="text-xs leading-relaxed font-normal select-text">${item.text}</p>
                    <div class="flex items-center justify-end gap-1 mt-1 text-[10px] text-gray-400">
                        <span>${item.time}</span>
                    </div>
                </div>
            `;
        }

        messageFeed.appendChild(messageWrapper);
        threadPreview.textContent = `${item.name}: ${item.text}`;
        scrollToBottom();
    }

    // Main Sequential Controller (Slowed down to 0.5x speed)
    function processNextStep() {
        if (currentStep >= conversationScript.length) return;

        const item = conversationScript[currentStep];

        if (item.sender === "lawyer") {
            // Show Typing animation first for Lawyer
            typingIndicator.classList.remove('hidden');
            scrollToBottom();

            timeoutId = setTimeout(() => {
                typingIndicator.classList.add('hidden');
                appendMessage(item);
                currentStep++;
                
                timeoutId = setTimeout(processNextStep, item.delay);
            }, item.typingTime);

        } else {
            // Detective sends message directly
            appendMessage(item);
            currentStep++;

            timeoutId = setTimeout(processNextStep, item.delay);
        }
    }

    // Auto-start on load
    window.onload = () => {
        processNextStep();
    };
</script>

</body>
</html>
