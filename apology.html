<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留给以宁的信</title>
    <!-- 引入高品质手写风格字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 沉稳暗淡的深色背景，模拟桌案场景 */
            background-color: #1a1715;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5rem 1.5rem 2.5rem 1.5rem;
        }

        /* 桌面构图场景（信纸容器） */
        .desk-scene {
            position: relative;
            width: 100%;
            max-width: 650px;
            /* 顶部预留合适空间 */
            padding: 4.8rem 3.2rem 3rem 3.2rem;
            /* 信纸基础外观：复古微黄便笺纸，带有自然行线 */
            background-color: #fdfbf7;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #ebdccb 31px,
                #ebdccb 32px
            );
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), 
                        0 2px 8px rgba(0, 0, 0, 0.2);
            /* 边缘微微卷起倾斜感 */
            transform: rotate(-0.6deg);
        }

        /* 缩小 1/3 后的真实储值卡（293px * 173px） */
        .cake-card {
            position: absolute;
            top: -65px;
            right: 18px;
            width: 293px;
            height: 173px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 6px 14px 28px rgba(0, 0, 0, 0.38);
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform: rotate(3.8deg);
            z-index: 10;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #eaeaea;
        }

        .cake-card:hover {
            transform: rotate(1deg) scale(1.03) translateY(-4px);
            box-shadow: 9px 18px 34px rgba(0, 0, 0, 0.42);
        }

        /* 右上角粉色花纹 SVG */
        .card-pattern-top {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 140px;
            height: 140px;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 左下角粉色花纹 SVG */
        .card-pattern-bottom {
            position: absolute;
            bottom: -16px;
            left: -16px;
            width: 100px;
            height: 100px;
            pointer-events: none;
            opacity: 0.4;
        }

        /* 卡片左上角品牌区 */
        .card-brand-group {
            position: relative;
            z-index: 2;
        }

        .card-brand-title {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: #d84374;
            letter-spacing: 2px;
            line-height: 1;
        }

        .card-brand-sub {
            display: flex;
            align-items: center;
            font-size: 0.64rem;
            color: #d84374;
            margin-top: 6px;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        .card-brand-sub .dot-icon {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #d84374;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 12px;
            font-size: 8px;
            margin: 0 4px;
        }

        /* 卡片右下角 CAKE 主题区 */
        .card-cake-group {
            position: relative;
            z-index: 2;
            align-self: flex-end;
            text-align: center;
            margin-bottom: 2px;
        }

        .card-cake-large {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-weight: 100;
            font-size: 2.8rem;
            color: #e880a2;
            line-height: 0.85;
            letter-spacing: 3px;
        }

        .card-cake-sub {
            font-size: 0.64rem;
            color: #d84374;
            letter-spacing: 1px;
            margin-top: 4px;
            white-space: nowrap;
        }

        /* 父亲的手写信内容 */
        .letter-content {
            margin-top: 0.5rem;
            font-family: "Ma Shan Zheng", "Ma Shan Zheng", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 1.45rem;
            line-height: 32px;
            color: #23201e;
            letter-spacing: 1.5px;
        }

        .letter-content p {
            margin-bottom: 0;
            text-indent: 0;
        }

        .letter-content p.indent {
            text-indent: 2em;
        }

        .letter-signature {
            margin-top: 1rem;
            text-align: right;
            font-weight: bold;
            font-size: 1.6rem;
            padding-right: 1.5rem;
        }

        /* 适应移动端屏幕 */
        @media (max-width: 600px) {
            .desk-scene {
                padding: 4rem 1.2rem 2rem 1.2rem;
            }
            .cake-card {
                width: 200px;
                height: 118px;
                top: -45px;
                right: 10px;
                padding: 0.8rem;
            }
            .card-brand-title {
                font-size: 1.25rem;
            }
            .card-brand-sub {
                font-size: 0.45rem;
            }
            .card-cake-large {
                font-size: 1.8rem;
            }
            .card-cake-sub {
                font-size: 0.45rem;
            }
            .letter-content {
                font-size: 1.2rem;
                line-height: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="desk-scene">
        <!-- 缩小 1/3 后的“芝心芝味”储值卡 -->


        <!-- 手写信主体 -->
        <div class="letter-content">
            <p>以宁：</p>
            <p class="indent">姐姐病情突然加重了，爸爸要陪她去医院复查。妈妈出差也赶不回来。</p>
            <p class="indent">今天的家长会只能你自己参加了。班主任说你这次期中考得很好，说你总是不需要我们担心。</p>
            <p class="indent">又没能去成你的家长会，对不起。</p>
            
            <div class="letter-signature">
                爸爸<br>
                2018.04.29
            </div>
        </div>
    </div>

</body>
</html>
