<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>青州大学附属高中 - 校友天地（查询结果）</title>
    <style>
        :root {
            --school-blue: #003366;       
            --school-accent: #0056b3;     
            --school-light-blue: #e6f2ff; 
            --ink-blue: #002244;          
            --bg-gray: #f4f7fa;           
            --text-dark: #1a2530;         
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e2e7ec; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text-dark); }

        .safari-view {
            width: 100vw;
            height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-content {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-gray);
            background-image: radial-gradient(rgba(0,51,102,0.02) 1px, transparent 0), radial-gradient(rgba(0,51,102,0.01) 1px, transparent 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }

        .school-header {
            background: #fff;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--school-blue);
        }
        
        .school-logo { display: flex; align-items: center; gap: 1px; }

        .logo-image-container {
            width: 70px;
            height: 70px;
            background: var(--school-blue);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .school-name-img { height: 75px; width: auto; object-fit: contain; display: block; }

        .nav-menu { display: flex; gap: 25px; font-size: 16px; font-weight: 600; }
        .nav-menu a { color: var(--text-dark); text-decoration: none; padding-bottom: 5px; transition: color 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--school-accent); border-bottom: 2px solid var(--school-accent); }

        .hero-section {
            padding: 45px 20px;
            background: linear-gradient(rgba(0, 51, 102, 0.75), rgba(26, 37, 48, 0.85)), url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; 
            background-position: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }
        .hero-title { color: #fff; font-size: 26px; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); font-weight: 500; letter-spacing: 2px; }
        .hero-subtitle { color: #b3d9ff; font-size: 14px; margin-bottom: 20px; letter-spacing: 1px; }
        
        .search-container { width: 100%; max-width: 640px; position: relative; }
        .search-input {
            width: 100%; height: 46px; border-radius: 23px; border: 2px solid #66b2ff;
            padding: 0 125px 0 25px; font-size: 15px; background: rgba(255, 255, 255, 0.98); outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .search-btn {
            position: absolute; right: 5px; top: 5px; bottom: 5px; width: 110px;
            background: var(--school-blue); color: white; border: none; border-radius: 18px; font-size: 14px; cursor: pointer;
            font-weight: bold; transition: background 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center;
        }
        .search-btn:hover { background: var(--school-accent); }

        /* 搜索结果卡片展示 */
        .search-result-modal {
            max-width: 640px; margin: 30px auto 40px auto; padding: 0 20px;
        }
        .alumni-card {
            background: #fff; border: 1px solid #cce0ff; border-top: 4px solid var(--school-blue);
            border-radius: 6px; padding: 20px 25px; box-shadow: 0 6px 20px rgba(0,51,102,0.1); position: relative;
        }
        .alumni-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #d0daf0; padding-bottom: 12px; margin-bottom: 15px; }
        .alumni-name { font-size: 20px; font-weight: bold; color: var(--ink-blue); display: flex; align-items: center; gap: 10px; }
        .alumni-tag { 
            font-size: 12px; background: var(--school-light-blue); color: var(--school-accent); 
            padding: 3px 10px; border-radius: 4px; font-weight: normal; cursor: pointer; 
            transition: all 0.2s; user-select: none;
        }
        .alumni-tag:hover { background: var(--school-accent); color: #fff; }
        .close-card-btn { cursor: pointer; color: #999; font-size: 18px; border: none; background: none; text-decoration: none; }
        .close-card-btn:hover { color: #333; }
        
        .alumni-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14.5px; }
        .alumni-item { display: flex; align-items: center; }
        .alumni-label { color: #64748b; width: 110px; flex-shrink: 0; }
        .alumni-value { color: var(--text-dark); font-weight: 500; }

        .school-footer { background: #0f172a; color: #94a3b8; padding: 30px 10%; text-align: center; font-size: 13px; line-height: 1.8; border-top: 5px solid var(--school-blue); }
        .footer-links { margin-bottom: 10px; color: #64748b; }

        .progress-indicator {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.6); color: #fff; padding: 6px 10px;
            border-radius: 8px; font-family: monospace; font-size: 0.85rem; z-index: 9999;
        }
    </style>
    <div class="progress-indicator">14/31</div>
</head>
<body>

<div class="safari-view">
    <div class="page-content">
        
        <header class="school-header">
            <div class="school-logo">
                <div class="logo-image-container">
                    <img src="logo.png" alt="学校Logo">
                </div>
                <img src="logo2.png" alt="青州大学附属高中" class="school-name-img">
            </div>
            <nav class="nav-menu">
                <a href="#">首页</a>
                <a href="#">附中概况</a>
                <a href="#">强基拔尖</a>
                <a href="#">教学科研</a>
                <a href="#" class="active">校友天地</a>
            </nav>
        </header>

        <div class="hero-section">
            <h2 class="hero-title">青水长流，木铎起思 —— 欢迎广大校友回家</h2>
            <p class="hero-subtitle">校友通讯录查询系统</p>
            <div class="search-container">
                <input type="text" id="alumniSearchInput" class="search-input" value="20171940323" readonly>
                <a href="alumni1.html" class="search-btn" style="display: flex; align-items: center; justify-content: center;">重新查询</a>
            </div>
        </div>

        <!-- 默认展示查询结果卡片 -->
        <div id="searchResultArea" class="search-result-modal">
            <div class="alumni-card">
                <div class="alumni-card-header">
                    <div class="alumni-name">
                        <span id="resName">顾思佳</span>
                        <!-- 点击时触发提示：通过考试降低年龄标准 -->
                        <span class="alumni-tag" id="resTag" onclick="alert('说明：该生通过学校特批选拔考试，符合降低年龄标准入学条件。')">2020届 特殊入学</span>
                    </div>
                    <!-- 关闭/返回按钮 -->
                    <a href="alumni1.html" class="close-card-btn" title="关闭">✕</a>
                </div>
                <div class="alumni-grid">
                    <div class="alumni-item"><span class="alumni-label">出生日期：</span><span class="alumni-value" id="resBirthday">8月9日</span></div>
                    <div class="alumni-item"><span class="alumni-label">生源地：</span><span class="alumni-value" id="resHome">凛州</span></div>
                    <div class="alumni-item"><span class="alumni-label">联系电话：</span><span class="alumni-value" id="resPhone">138xxxx2923</span></div>
                    <div class="alumni-item"><span class="alumni-label">紧急联系人：</span><span class="alumni-value" id="resContact">顾兆元</span></div>
                    <div class="alumni-item"><span class="alumni-label">关系：</span><span class="alumni-value" id="resRelation">外公</span></div>
                    <div class="alumni-item"><span class="alumni-label">紧急联系电话：</span><span class="alumni-value" id="resContactPhone">136xxxx0729</span></div>
                </div>
            </div>
        </div>

        <footer class="school-footer" style="margin-top: 100px;">
            <div class="footer-links">
                <span>校友会联系电话：0312-XXXXXXX</span> | <span>地址：中国·临渊·青州市勤学路1号 校友楼302室</span>
            </div>
            <p>版权所有 © 2026 青州大学附属高中校友会</p>
        </footer>
    </div>
</div>

</body>
</html>
