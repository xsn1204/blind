<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收银客显屏 - 康民大药房</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #1c3123; /* 暗色木质桌面感 */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* 显示器与支架整体包裹容器 */
        .monitor-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 电子屏幕硬件外框 */
        .device-frame {
            width: 78vw;
            height: 75vh;
            max-width: 1350px;
            max-height: 780px;
            background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
            border: 12px solid #222;
            border-radius: 16px;
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.8),
                inset 0 0 6px rgba(255, 255, 255, 0.1);
            display: flex;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        /* 电脑屏底座支架系统 */
        .stand-neck {
            width: 90px;
            height: 55px;
            background: linear-gradient(90deg, #333 0%, #555 30%, #666 50%, #444 70%, #222 100%);
            margin-top: -2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1;
            position: relative;
        }

        .stand-neck::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.4);
        }

        .stand-base {
            width: 280px;
            height: 16px;
            background: linear-gradient(180deg, #444 0%, #222 60%, #111 100%);
            border-radius: 8px 8px 12px 12px;
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.9),
                0 2px 0 rgba(255, 255, 255, 0.1) inset;
            border-bottom: 2px solid #0a0a0a;
            z-index: 1;
        }

        /* 屏幕显示区域 */
        .screen-display {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: #ffffff;
            border-radius: 4px;
            overflow: hidden;
        }

        /* 左侧：电子收银屏（自适应填充剩余宽度） */
        .checkout-side {
            flex: 1;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.08);
            z-index: 2;
        }

        /* 1. 顶部状态栏 */
        .system-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f5f7;
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 12px;
            color: #666;
            margin-bottom: 12px;
        }

        .status-tags {
            display: flex;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot-online {
            width: 7px;
            height: 7px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
        }

        .live-clock {
            font-weight: bold;
            color: #333;
            font-family: monospace;
            font-size: 13px;
        }

        /* 2. 药房 Header */
        .store-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #00a54f;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .store-name-box {
            font-size: 17px;
            font-weight: bold;
            color: #222;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .highlight-hospital {
            background-color: #d32f2f;
            color: #ffffff;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(211, 47, 47, 0.2);
        }

        /* 3. 操作员与订单元数据 */
        .meta-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #fafafa;
            border: 1px solid #eeeeee;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #555;
            margin-bottom: 12px;
        }

        .meta-info-grid strong {
            color: #222;
        }

        /* 4. 交易明细列表 */
        .items-mini-list {
            flex: 1;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 9px 12px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .mini-list-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 7px;
        }

        .mini-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #333;
            margin-bottom: 5px;
        }

        .mini-item-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 8px;
        }

        .mini-item-price {
            font-weight: 600;
        }

        .discount-row {
            color: #d32f2f;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #eee;
            padding-top: 5px;
            margin-top: 5px;
        }

        /* 5. 汇总金额 */
        .summary-total-box {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .total-label {
            font-size: 14px;
            color: #444;
            font-weight: bold;
        }

        .total-amount {
            font-size: 34px;
            font-weight: 900;
            color: #e53935;
            line-height: 1;
        }

        /* 6. 操作按钮区 */
        .payment-action-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-status-box {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }

        .payment-status-box p {
            font-size: 13px;
            color: #2e7d32;
            font-weight: bold;
        }

        .print-btn {
            width: 100%;
            height: 42px;
            background: #00a54f;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 165, 79, 0.2);
            transition: all 0.2s ease;
        }

        .print-btn:hover {
            background: #008e43;
        }

        /* 右侧海报区：精准比例支撑 */
        .poster-side {
            height: 100%;
            aspect-ratio: 1000 / 1414;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
        }

        .poster-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .progress-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            z-index: 9999;
        }

        /* 邮箱验证弹窗样式 */
        #emailModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20000;
        }
        .modal-box {
            background: #222;
            border: 1px solid #444;
            padding: 25px 30px;
            border-radius: 8px;
            width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }
        .modal-input {
            width: 100%;
            padding: 8px 12px;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            background: #00a54f;
            color: #fff;
            border: none;
            padding: 8px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .modal-btn:hover {
            background: #008e43;
        }
        .modal-btn-cancel {
            background: #444;
        }
        .modal-btn-cancel:hover {
            background: #555;
        }
        .error-tip {
            color: #f87171;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }
    </style>                             <div class="progress-indicator">19/31</div></head>
<body>

    <!-- 硬件设备与支架总容器 -->
    <div class="monitor-wrapper">

        <!-- 硬件电子屏幕框 -->
        <div class="device-frame">
            <div class="screen-display">
                
                <!-- 左侧：收银控制与结算屏 -->
                <div class="checkout-side">
                    
                    <!-- 1. 系统顶栏 -->
                    <div class="system-status-bar">
                        <div class="status-tags">
                            <span class="status-item"><i class="dot-online"></i> POS 01号机</span>
                            <span class="status-item">🖨️ 打印机就绪</span>
                        </div>
                        <div class="live-clock" id="clock">2018-08-10 10:22:20</div>
                    </div>

                    <!-- 2. 店铺 Header -->
                    <div class="store-header">
                        <div class="store-name-box">
                            <span>康民大药房</span>
                            <span class="highlight-hospital">青医附院店</span>
                        </div>
                    </div>

                    <!-- 3. 操作员与订单元数据 -->
                    <div class="meta-info-grid">
                        <div>操作员：<strong>8012</strong></div>
                        <div>支付方式：<strong>银联刷卡支付</strong></div>
                        <div style="grid-column: span 2;">流水号：<strong>NO.2018081010228941</strong></div>
                    </div>

                    <!-- 4. 购买商品小明细 -->
                    <div class="items-mini-list">
                        <div class="mini-list-header">
                            <span>商品名称</span>
                            <span>数量 / 金额</span>
                        </div>
                        <div class="mini-item-row">
                            <span class="mini-item-name">同仁堂破壁灵芝孢子粉</span>
                            <span class="mini-item-price">2盒 / ¥1,520.00</span>
                        </div>
                        <div class="mini-item-row">
                            <span class="mini-item-name">极地深海鱼油软胶囊</span>
                            <span class="mini-item-price">2瓶 / ¥1,320.00</span>
                        </div>
                        <div class="discount-row">
                            <span>盛夏满减抵用券活动</span>
                            <span>- ￥0.00</span>
                        </div>
                    </div>

                    <!-- 5. 汇总金额 -->
                    <div class="summary-total-box">
                        <div class="total-label">实付金额 (RMB)</div>
                        <div class="total-amount">￥ 2,840.00</div>
                    </div>

                    <!-- 6. 状态与跳转按钮 -->
                    <div class="payment-action-area">
                        <div class="payment-status-box">
                            <p>✓ 交易已完成 · 欢迎再次光临</p>
                        </div>

                        <!-- 点击触发弹窗验证 -->
                        <button class="print-btn" type="button" onclick="openEmailModal()">
                            🖨️ 打印发票 / 凭证
                        </button>
                    </div>

                </div>

                <!-- 右侧：poster.png 紧密无缝展示区 -->
                <div class="poster-side">
                    <img src="poster.png" alt="促销活动海报" class="poster-image">
                </div>

            </div>
        </div>

        <!-- 下方桌面电脑显示器支架 -->
        <div class="stand-neck"></div>
        <div class="stand-base"></div>

    </div>

    <!-- 邮箱验证弹窗 -->
    <div id="emailModal">
        <div class="modal-box">
            <div class="modal-title">✉️ 请输入接收凭证的邮箱</div>
            <input type="email" id="emailInput" class="modal-input" placeholder="请输入电子邮箱..." onkeydown="if(event.key==='Enter') verifyEmail()">
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeEmailModal()">取消</button>
                <button class="modal-btn" onclick="verifyEmail()">确认并打印</button>
            </div>
            <div id="errorTip" class="error-tip">邮箱输入错误，请重新输入</div>
        </div>
    </div>

    <script>
        function openEmailModal() {
            document.getElementById('emailModal').style.display = 'flex';
            document.getElementById('emailInput').value = '';
            document.getElementById('errorTip').style.display = 'none';
            document.getElementById('emailInput').focus();
        }

        function closeEmailModal() {
            document.getElementById('emailModal').style.display = 'none';
        }

        function verifyEmail() {
            const email = document.getElementById('emailInput').value.trim();
            const errorTip = document.getElementById('errorTip');
            if (email === 'edenduan@qmail.com') {
                closeEmailModal();
                window.open('receipt.html', '_blank');
            } else {
                errorTip.style.display = 'block';
            }
        }
    </script>
</body>
</html>
