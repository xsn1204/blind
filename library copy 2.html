<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>404药案重启事件 - 正方形居中封面复刻</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Serif SC', 'Songti SC', SimSun, serif;
        }

        /* 封面主容器：正方形 600px * 600px */
        .book-cover {
            width: 600px;
            height: 600px;
            background: url('bg.png') no-repeat center center;
            background-size: cover;
            filter: contrast(130%);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* 增加一层半透明黑色遮罩，使背景更暗、对比度更高 */
        .book-cover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        /* 整体内容采用严格的垂直、水平居中框架 */
        .cover-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        /* 顶部英文手写签名：居中呈现 */
        .top-signature {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 26px;
            color: #ffffff;
            letter-spacing: 1px;
            transform: rotate(-3deg);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            margin-bottom: 25px;
        }

        /* 英文副标：重点加粗居中显示 */
        .german-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2.5px;
            margin-bottom: 20px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        /* 中间树叶小插图：居中 */
        .leaves-icon {
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
        }
        .leaves-icon svg {
            width: 100%;
            height: 100%;
            fill: #ffffff;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9));
        }

        /* 中文主书名容器：居中显示，双行独立重点突出 */
        .main-title {
            text-align: center;
            line-height: 1.35;
            text-shadow: 0 2px 10px rgba(0,0,0,0.95);
            margin-bottom: 25px;
        }

        /* 第一行：“404药案” —— 核心重点放大 (50px) */
        .title-line-1 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: 80px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 12px;
            margin-left: 12px;
            margin-bottom: 10px;
        }

        /* 第二行：“重启事件” —— 协调次大 (38px) */
        .title-line-2 {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            font-size: 75px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 12px;
            margin-left: 12px;
        }

        /* 作者信息及丛书名改为居中重点显示 */
        .side-text.right {
            font-size: 14px;
            color: #ffffff;
            letter-spacing: 4px;
            line-height: 1.8;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            margin-bottom: 2px;
        }

        /* 英文作者署名 */
        .author-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <div class="book-cover">
        <!-- 整体绝对居中的排版结构 -->
        <div class="cover-content">
            <!-- 顶上手写签名 -->
  

            <!-- 树叶小插图 -->
            <div class="leaves-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M17.5,2C17.5,2 14,5 14,9.5C14,13 16,15 16,18C16,21 14,22 14,22C14,22 19,20 20,15C21,10 17.5,2 17.5,2Z" opacity="0.9"/>
                    <path d="M9.5,4C9.5,4 6,7 6,11.5C6,15 8,17 8,20C8,23 6,24 6,24C6,24 11,22 12,17C13,12 9.5,4 9.5,4Z"/>
                </svg>
            </div>

            <!-- 中文主书名：中心点显著放大 -->
            <div class="main-title">
                <div class="title-line-1">404药案</div>
                <div class="title-line-2">重启事件</div>
            </div>

            <!-- 原右侧竖排文字改为居中重点显示 -->
            <div class="side-text right">
                AAA地下党 著
            </div>

            <!-- 英文作者署名 -->
            <div class="author-name">AAA Underground</div>
        </div>
    </div>

</body>
</html>
