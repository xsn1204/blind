<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留给以宁的信</title>
    <!-- 引入高品质手写风格字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 更加黑暗沉重的夜晚背景 */
            background-color: #2f2e2d;
            background-image: radial-gradient(circle at 50% 50%, #151311 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 1.5rem 2.5rem 1.5rem;
        }

        /* 桌面构图场景（信纸容器） */
        .desk-scene {
            position: relative;
            width: 100%;
            max-width: 650px;
            padding: 4rem 3.2rem 3rem 3.2rem;
            /* 色调更显压抑暗淡的复古黄便笺纸，深色行线 */
            background-color: #f2ebd9;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #d8c7b2 31px,
                #d8c7b2 32px
            );
            border-radius: 3px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85), 
                        0 5px 15px rgba(0, 0, 0, 0.5);
            /* 微倾斜角 */
            transform: rotate(-0.5deg);
        }

        /* 父亲的手写信内容 */
        .letter-content {
            margin-top: 0.5rem;
            font-family: "Ma Shan Zheng", "Ma Shan Zheng", "Kaiti", "STKaiti", "楷体", serif;
            font-size: 1.45rem;
            line-height: 32px;
            color: #1e1b18;
            letter-spacing: 1.5px;
        }

        .letter-content p {
            margin-bottom: 0;
            text-indent: 0;
        }

        .letter-content p.indent {
            text-indent: 2em;
        }

        .letter-signature {
            margin-top: 1.5rem;
            text-align: right;
            font-weight: bold;
            font-size: 1.6rem;
            padding-right: 1.5rem;
            line-height: 1.4;
        }

        /* 适应移动端屏幕 */
        @media (max-width: 600px) {
            .desk-scene {
                padding: 3rem 1.5rem 2rem 1.5rem;
            }
            .letter-content {
                font-size: 1.25rem;
                line-height: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="desk-scene">
        <!-- 手写信主体 -->
        <div class="letter-content">
            <p>以宁：</p>
            <p class="indent">这次姐姐住院的时间可能会比较久，爸爸已经向单位请了长假全天在医院陪同。</p>
            <p class="indent">妈妈也接到了公司的外派任务，近期需要出差一段时间。</p>
            <p class="indent">新的学期就快开始了，爸爸妈妈希望你能学会照顾好自己。</p>
                      <p class="indent">抱歉。</p>
            
            <div class="letter-signature">
                爸爸<br>
                2018.08.25
            </div>
        </div>
    </div>

</body>
</html>
