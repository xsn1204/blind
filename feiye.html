<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惠君 - 护封勒口</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Songti SC", "SimSun", "STSong", "Source Han Serif SC", serif;
        }

        /* 还原大冰书籍勒口的极狭长比例 (宽高比约为 1:3) */
        .flap-container {
            width: 240px;
            height: 720px;
            background-color: #0d1b2a; /* 深邃诡异的暗青蓝色底色 */
            padding: 40px 22px 30px 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            color: #d1d5db;
        }

        /* 黑白照容器：还原大冰勒口顶部照片位置与比例 */
        .photo-wrapper {
            width: 100%;
            height: 210px;
            margin-bottom: 25px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .author-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(140%) brightness(80%);
            opacity: 0.85;
        }

        /* 姓名与生卒年 */
        .author-header {
            margin-bottom: 18px;
            width: 100%;
        }

        .author-name {
            font-size: 19px;
            font-weight: 600;
            color: #f3f4f6;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .author-dates {
            font-size: 12px;
            color: #9ca3af;
            font-family: "Georgia", serif;
            letter-spacing: 1px;
        }

        /* 正文段落排版：整段介绍，营造惊悚诡异感 */
        .author-bio {
            font-size: 12.5px;
            line-height: 1.85;
            color: #9ca3af;
            text-align: justify;
            letter-spacing: 0.8px;
        }

        .author-bio p {
            margin-bottom: 14px;
            text-indent: 2em;
        }

        /* 代表作样式 */
        .works-title {
            font-size: 13px;
            font-weight: bold;
            color: #e5e7eb;
            margin-top: 6px;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .works-list {
            font-size: 12px;
            color: #6b7280;
            line-height: 1.7;
            padding-left: 2em;
        }

        /* 底部落款 */
        .footer-note {
            margin-top: auto;
            font-size: 11px;
            color: #4b5563;
            letter-spacing: 0.5px;
        }
    /* 1寸照片容器比例与居中对齐 */
    .photo-wrapper {
        width: 105px;             /* 标准1寸照片宽度比例 */
        height: 147px;            /* 标准1寸照片高度比例 (25:35) */
        margin: 0 auto 20px auto; /* 水平居中并留出下边距 */
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        background-color: #000;
    }

    /* 纯黑白滤镜效果 */
    .author-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(100%) contrast(120%); /* 100% 黑白处理 */
        display: block;
    }

                            .progress-indicator {
    position: fixed;
   bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.85rem;
    z-index: 9999;
}
    </style>                             <div class="progress-indicator">extra3/38</div></head>
<body>

    <div class="flap-container">
        
        <!-- 黑白诡异风格艺术照片 -->
        <div class="photo-wrapper">
            <img class="author-photo" src="photo.png" alt="惠君黑白肖像">
        </div>

        <!-- 姓名与生卒年 -->
        <div class="author-header">
            <div class="author-name">惠君</div>
            <div class="author-dates">1974 — 2009</div>
        </div>

        <!-- 正常介绍段落（带有惊悚与压抑氛围的生平故事） -->
        <div class="author-bio">
            <p>
               惠君，自幼喜欢阅读，大学毕业后曾任教于小学，后来专事写作，因肺病去世。她一生作品不多，却始终将目光放在孩子身上，常从日常生活里寻找故事，记录少年在成长途中感受到的孤单与欢喜。


            </p>
            <p>
                她的文字清丽温婉，注重以平实自然的叙述呈现青少年的内心世界，在朴素的故事中展现成长、友情与亲情等主题。代表作品多次入选中小学生课外读物及校园阅读书单。

            <div class="works-title">主要代表作品：</div>
            <div class="works-list">
                《云知道答案》<br>
                《萤火之秋》<br>
                《风从海上来》<br>
            </div>
        </div>

        <div class="footer-note">
            * 谨以此页纪念已故作家惠君。
        </div>

    </div>

</body>
</html>
