<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>404心动失明事件</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", system-ui, sans-serif;
}
body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    position:relative;
    cursor:pointer;
}
/* 底层壁纸容器 + 毛玻璃模糊层 */
.bg-wallpaper{
    position:fixed;
    inset:0;
    background:#000 url('wallpaper.png') center/cover no-repeat;
    z-index:-2;
}
.bg-blur-mask{
    position:fixed;
    inset:0;
    /* 毛玻璃模糊底层壁纸 */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.15);
    z-index:-1;
}
body{
    color:#ffffff;
}
/* 右上角 喜欢吗 小标识 */
.like-tip{
    position:absolute;
    top:30px;
    right:30px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    opacity:0.75;
}
.like-tip svg{
    width:18px;
    fill:#fff;
}
/* 右下角状态栏wifi电池 */
.status-bar{
    position:absolute;
    bottom:20px;
    right:30px;
    display:flex;
    gap:16px;
    opacity:0.75;
}
.status-bar svg{
    width:22px;
    fill:#fff;
}
/* 登录弹窗遮罩层 */
.login-wrap{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.4);
}
.login-wrap.show{
    display:flex;
}
/* 用户头像圆形 */
.user-avatar{
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}
.user-avatar svg{
    width:120px;
    fill:#fff;
}
/* 用户名样式 */
.user-title {
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 1px;
}
/* 文本固定宽度居中 */
.user-name{
    font-size:16px;
    font-weight:300;
    margin: 0 auto 32px;
    width: 600px;
    line-height: 1.7;
    text-align:center;
}
/* 密码输入框容器 */
.input-box{
    display:flex;
    align-items:center;
    width:420px;
    border:1px solid rgba(255,255,255,0.6);
}
.pwd-input{
    flex:1;
    height:46px;
    padding:0 16px;
    background:transparent;
    border:none;
    color:#fff;
    font-size:16px;
    outline:none;
}
.pwd-input::placeholder{
    color:rgba(255,255,255,0.6);
}
.submit-btn{
    width:50px;
    height:46px;
    background:rgba(255,255,255,0.2);
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
.submit-btn svg{
    width:20px;
    fill:#fff;
}
/* 提示文字 */
.tip-text{
    margin-top:16px;
    font-size:16px;
    opacity:0.8;
    text-align:center;
}
.reset-text{
    margin-top:20px;
    font-size:16px;
    opacity:0.7;
    cursor:pointer;
}
.reset-text:hover{
    opacity:1;
    text-decoration:underline;
}
/* 左下角时间日期 */
.time-box{
    position:absolute;
    left:40px;
    bottom:120px;
    user-select:none;
}
.time-num{
    font-size:120px;
    font-weight:200;
    line-height:1;
    opacity:0.95;
}
.date-text{
    font-size:36px;
    font-weight:300;
    margin-top:8px;
    opacity:0.9;
}
      .floating-signature {
            position: fixed;
            right: 48px;
            bottom:  36px; /* 挪到了上方，避免遮挡系统图标 */
            width: 200px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            opacity: 0.6;
            transition: 0.3s;
        }
        .floating-signature:hover { opacity: 1; }
        .floating-signature img { width: 100%; display: block; }

<!-- 右下角WiFi电池图标 -->
<div class="status-bar">
    <svg viewBox="0 0 24 24">
        <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>

    </svg>

<!-- Win10登录面板（点击画面弹出） -->
<div class="login-wrap" id="loginPanel">
    <div class="user-avatar">
        <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
    </div>
    <!-- 新增用户名 -->
    <div class="user-title">404心动失明事件</div>
    <div class="user-name">你是<strong>【宋以宁】</strong>。高中好友忽然发来消息，托你找一份多年前的广播台退台稿。<br>你登录进这台早已闲置的设备，翻找着网盘与零散文档。<br>循着花名册和回忆的碎片，你恍然发觉——
    <br>青春留给你的最后一页，是一场旷日持久的视而不见……</div>
    <div class="input-box">
        <input class="pwd-input" id="pwdInput" placeholder="已知信息 -> 发现关键词 -> 搜索 -> 获得新信息" type="password">
        <button class="submit-btn" id="enterBtn">
            <svg viewBox="0 0 24 24">
                <path d="M12.4 7l5.6 5.6-5.6 5.6-1.4-1.4 4.2-4.2-4.2-4.2z"/>
            </svg>
        </button>
    </div>
    <div class="tip-text">密码提示: 🔔第一步，不妨试着从搜搜【你自己的名字】开始，祝你好运。</div>
</div>
 <div class="floating-signature">
        <img src="signature.jpg" alt="关键签名">
    </div>

<script>
const loginPanel = document.getElementById('loginPanel');
const pwdInput = document.getElementById('pwdInput');
const enterBtn = document.getElementById('enterBtn');

// 点击锁屏背景弹出登录框，点击登录面板内部不重复触发
document.body.addEventListener('click', function(e){
    if(loginPanel.contains(e.target)) return;
    loginPanel.classList.add('show');
    pwdInput.focus();
})

// 跳转桌面逻辑
function toDesktop(){
    window.location.href = "desk.html";
}
// 点击箭头按钮进入桌面
enterBtn.addEventListener('click', toDesktop);
// 按下回车键直接登录
pwdInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter') toDesktop();
})
</script>
<script>
    // 捕获整个屏幕的点击事件，包括子元素
    document.querySelector('.screen').addEventListener('click', function() {
        // 跳转到下一个页面
        window.location.href = 'desk.html'; // 替换为你的目标页面
    });

    // 可选：改变鼠标指针，提示用户可点击
    document.querySelector('.screen').style.cursor = 'pointer';
</script>
