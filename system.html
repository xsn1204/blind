<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>青医附院 - 旧版档案查询系统</title>
    <style>
        /* 复古旧版系统风格 */
        body {
            font-family: "SimSun", "宋体", serif;
            font-size: 13px;
            background-color: #d4d0c8;
            color: #000;
            margin: 0;
            padding: 40px 20px;
            overflow: hidden; /* 特效期间禁止滚动条 */
        }

        /* 纯视觉崩溃/电视机闪电雪花特效遮罩 */
        #glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            overflow: hidden;
            opacity: 1;
            transition: opacity 1.5s ease; /* 缓缓浮现界面的过渡动画 */
        }

        /* 第一秒：高频彩色噪点与电视雪花 */
        .effect-noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.7"/></svg>');
            animation: noiseShift 0.1s steps(2) infinite, phaseOne 1.2s forwards;
            z-index: 1;
        }

        /* 闪电与雪花叠加层 */
        .effect-lightning-snow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* 雪花粒子样式 */
        .snow-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: snowFall linear infinite;
        }

        @keyframes snowFall {
            0% {
                transform: translateY(-10vh) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) translateX(20px);
                opacity: 0.2;
            }
        }

        /* 闪电轰鸣特效（总时长适配延长到17s循环） */
        .effect-lightning-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            animation: lightningStrike 17s infinite;
        }

        @keyframes lightningStrike {
            0%, 12%, 15%, 43%, 45%, 70%, 90% {
                opacity: 0;
            }
            12.5%, 44%, 70.5%, 90.2% {
                opacity: 0.85;
            }
            13%, 44.5%, 71% {
                opacity: 0.2;
            }
        }

        /* 第二秒：五彩斑斓的电视台故障色条与撕裂 */
        .effect-colorbars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, 
                rgba(255,0,0,0.6) 0%, rgba(255,255,0,0.6) 20%, 
                rgba(0,255,0,0.6) 40%, rgba(0,255,255,0.6) 60%, 
                rgba(0,0,255,0.6) 80%, rgba(255,0,255,0.6) 100%);
            mix-blend-mode: color-dodge;
            opacity: 0;
            animation: phaseTwo 1.5s 1.2s forwards, colorShift 0.2s infinite;
            z-index: 4;
        }

        /* 强烈的屏幕颠簸、剧烈反相闪烁与坏道扫描线 */
        .effect-glitch-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.8),
                rgba(0, 0, 0, 0.8) 2px,
                rgba(255, 255, 255, 0.2) 4px
            );
            opacity: 0;
            animation: phaseThree 1.3s 2.7s forwards, screenShake 0.15s infinite;
            z-index: 5;
        }

        /* 最终压轴白屏闪烁 */
        .effect-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 6;
        }

        .effect-flash.active {
            animation: phaseFour 0.5s forwards;
        }

        /* --- 前三句故障文字碎片样式 --- */
        .glitch-fragment {
            position: absolute;
            font-family: "SimSun", "宋体", serif;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8), -2px -2px 10px rgba(0, 255, 255, 0.8);
        }

        .tv-static {
            filter: blur(0.5px);
        }

        .frag-1 {
            top: 25%;
            left: 15%;
            font-size: 22px;
            color: #ffcccc;
            animation: textFlow1 7s forwards; /* 随总时长等比拉长 */
        }

        .frag-2 {
            top: 45%;
            right: 15%;
            font-size: 20px;
            color: #ffffff;
            animation: textFlow2 7s forwards; /* 随总时长等比拉长 */
        }

        /* 第三句【这样做究竟又能挽回些什么呢？】：总时长拉长到 7 秒，且在后半段保持更长时间的显示（停留延长2s） */
        .frag-3 {
            top: 65%;
            left: 20%;
            font-size: 18px;
            color: #ffdddd;
            animation: textFlow3 7s forwards;
        }

        /* 压轴第四句 */
        .frag-4 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #ff3333;
            letter-spacing: 2px;
            z-index: 20;
            opacity: 0;
            text-shadow: 2px 2px 15px rgba(255, 0, 0, 0.9), -2px -2px 15px rgba(255, 255, 255, 0.5);
            transition: opacity 0.3s ease;
        }

        /* 打字机光标闪烁特效 */
        .typewriter-cursor {
            display: inline-block;
            width: 10px;
            height: 32px;
            background-color: #ff3333;
            margin-left: 4px;
            vertical-align: middle;
            animation: cursorBlink 0.6s infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes textFlow1 {
            0%, 4% { opacity: 0; transform: translateX(-15px); }
            8% { opacity: 0.95; transform: translateX(0); }
            22% { opacity: 0.95; transform: translateX(0); }
            26% { opacity: 0; transform: translateX(10px); }
            100% { opacity: 0; }
        }

        @keyframes textFlow2 {
            0%, 25% { opacity: 0; transform: translateY(15px); }
            30% { opacity: 1; transform: translateY(0); }
            44% { opacity: 1; transform: translateY(0); }
            48% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 0; }
        }

        /* 第三句动画：显现后延长停留，直到约 6.8 秒 ~ 7 秒才淡出 */
        @keyframes textFlow3 {
            0%, 48% { opacity: 0; transform: scale(0.95); }
            54% { opacity: 0.95; transform: scale(1); }
            92% { opacity: 0.95; transform: scale(1); } /* 延长保持高亮停留的时间 */
            98% { opacity: 0; transform: scale(1.05); }   /* 接近7秒时消失 */
            100% { opacity: 0; }
        }

        @keyframes noiseShift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-15px, 20px); filter: invert(1); }
            100% { transform: translate(15px, -15px); }
        }

        @keyframes colorShift {
            0% { transform: translateY(0) scaleY(1); filter: hue-rotate(0deg); }
            50% { transform: translateY(-10px) scaleY(1.2); filter: hue-rotate(180deg) blur(2px); }
            100% { transform: translateY(5px) scaleY(0.9); filter: hue-rotate(360deg); }
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0) skewX(0); }
            20% { transform: translate(-25px, 10px) skewX(-30deg); filter: contrast(300%); }
            40% { transform: translate(20px, -15px) skewX(20deg); }
            60% { transform: translate(-10px, -5px) skewX(-15deg); filter: invert(0.8); }
            80% { transform: translate(15px, 15px) skewX(10deg); }
            100% { transform: translate(0, 0) skewX(0); }
        }

        @keyframes phaseOne {
            0% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

        @keyframes phaseTwo {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        @keyframes phaseThree {
            0% { opacity: 0; }
            50% { opacity: 0.9; }
            100% { opacity: 0.7; }
        }

        @keyframes phaseFour {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 窗体整体初始入场动效 */
        .window {
            width: 520px;
            margin: 0 auto;
            background-color: #d4d0c8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease, transform 1s ease;
        }

        .window.show {
            opacity: 1;
            transform: scale(1);
        }

        .title-bar {
            background-color: #000080;
            color: #ffffff;
            padding: 3px 6px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-body {
            padding: 20px;
        }

        .system-info {
            background-color: #ffffcc;
            border: 1px solid #808080;
            padding: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #333;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table td {
            padding: 8px 4px;
            vertical-align: middle;
        }

        .form-table label {
            font-weight: bold;
        }

        .form-table input {
            width: 100%;
            padding: 4px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background-color: #ffffff;
            box-sizing: border-box;
            font-family: "SimSun", "宋体";
            font-size: 13px;
        }

        .btn-group {
            margin-top: 20px;
            text-align: center;
        }

        .btn-win {
            padding: 6px 20px;
            background-color: #d4d0c8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            font-family: "SimSun", "宋体";
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn-win:active {
            border-color: #808080 #ffffff #ffffff #ffffff;
        }

        .error-msg {
            color: #cc0000;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .footer-status {
            margin-top: 20px;
            border-top: 1px solid #808080;
            padding-top: 8px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }

        .progress-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- 纯视觉崩溃、闪电、电视雪花层与文字碎片 -->
<div id="glitch-overlay">
    <div class="effect-noise"></div>
    <div class="effect-lightning-flash"></div>
    <div class="effect-lightning-snow" id="snowContainer"></div>
    <div class="effect-colorbars"></div>
    <div class="effect-glitch-lines"></div>
    <div class="effect-flash" id="flashEffect"></div>

    <!-- 前三句故障碎片文字 -->
    <div class="glitch-fragment frag-1 tv-static">疑是口中血，滴成枝上花。</div>
    <div class="glitch-fragment frag-2 tv-static">又闻子规啼夜月，愁空山。</div>
    <div class="glitch-fragment frag-3 tv-static">这样做究竟又能挽回些什么呢？</div>
    
    <!-- 压轴：独立由JS控制的打字机容器（在第三句消失后才出现） -->
    <div class="frag-4" id="typewriterText"></div>
</div>

<!-- 主窗体 -->
<div class="window" id="mainWindow">
    <div class="title-bar">
        <span>青医附院 - 旧版档案查询系统</span>
    </div>

    <div class="window-body">
        <div class="system-info">
            [系统提示] 本系统仅用于检索 2000 年 1 月 1 日以前建档的纸质数字化病历资料。
        </div>

       <form id="searchForm" onsubmit="return handleSearch(event)">
            <table class="form-table">
                <tr>
                    <td style="width: 80px;"><label for="patientName">患者姓名：</label></td>
                    <td><input type="text" id="patientName" placeholder="请输入完整姓名" required></td>
                </tr>
                <tr>
                    <td><label for="birthDate">出生日期：</label></td>
                    <td><input type="text" id="birthDate" placeholder="格式如：19800101" maxlength="8" required></td>
                </tr>
            </table>

            <div class="error-msg" id="errorTip">未查询到符合条件的档案，请检查姓名及生日！</div>

            <div class="btn-group">
                <button type="submit" class="btn-win">查询档案 (Enter)</button>
                <button type="reset" class="btn-win" onclick="document.getElementById('errorTip').style.display='none'">清空重填</button>
            </div>
        </form>

        <div class="footer-status">
            数据库状态：在线 | 当前版本：1999-12-31 ARCHIVE BUILD
        </div>
    </div>
</div>

<div class="progress-indicator">27/31</div>

<script>
    // 动态生成雪花粒子
    const snowContainer = document.getElementById('snowContainer');
    const snowCount = 60; 
    for (let i = 0; i < snowCount; i++) {
        const star = document.createElement('div');
        star.classList.add('snow-particle');
        star.style.left = `${Math.random() * 100}vw`;
        star.style.top = `${Math.random() * -100}vh`;
        const size = Math.random() * 3 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.animationDuration = `${Math.random() * 2 + 1}s`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        snowContainer.appendChild(star);
    }

    const targetString = "惠君回来了。"; // 共 6 个字符
    const typewriterContainer = document.getElementById('typewriterText');
    const glitchOverlay = document.getElementById('glitch-overlay');
    const mainWindow = document.getElementById('mainWindow');
    const flashEffect = document.getElementById('flashEffect');
    let charIndex = 0;

    function startTypewriter() {
        if (charIndex < targetString.length) {
            typewriterContainer.innerHTML = targetString.substring(0, charIndex + 1) + '<span class="typewriter-cursor"></span>';
            charIndex++;
            setTimeout(startTypewriter, 1000); // 1秒一个字
        } else {
            // 打字完成（历时 6 秒），保留文字并停顿 2 秒
            typewriterContainer.innerHTML = targetString; 
            
            setTimeout(() => {
                // 停顿 2 秒结束后：触发白闪
                flashEffect.classList.add('active');

                // 白闪亮起瞬间，遮罩层淡出，主窗体缓缓浮现
                setTimeout(() => {
                    glitchOverlay.style.opacity = "0";
                    mainWindow.classList.add('show');
                }, 200);

                // 动画完成后彻底隐藏遮罩并开启页面滚动
                setTimeout(() => {
                    glitchOverlay.style.display = "none";
                    document.body.style.overflow = "auto";
                }, 1500);
            }, 2000); // 停顿 2s
        }
    }

    // 前三句碎片的 CSS 动画总时长延长到了 7 秒。
    // 我们让第三句完全消失后（约 7.2 秒），才让“惠君回来了。”显形并启动 1s/字的打字机。
    setTimeout(() => {
        typewriterContainer.style.opacity = "1";
        startTypewriter();
    }, 7200);

    const targetPatient = {
        name: "顾惠君",
        birth: "19740407"
    };

    function handleSearch(e) {
        e.preventDefault();

        const inputName = document.getElementById('patientName').value.trim();
        const inputBirth = document.getElementById('birthDate').value.trim();
        const errorTip = document.getElementById('errorTip');

        if (inputName === targetPatient.name && inputBirth === targetPatient.birth) {
            errorTip.style.display = 'none';
            window.open('history.html', '_blank');
        } else if (inputName === "惠君") {
            errorTip.innerText = "请输入完整姓名";
            errorTip.style.display = 'block';
        } else {
            errorTip.innerText = "未查询到符合条件的档案，请检查姓名及生日！";
            errorTip.style.display = 'block';
        }

        return false;
    }
</script>

</body>
</html>
