    <title>小票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 初始：明亮温暖的吧台氛围 */
            background-color: #f3efe6;
            font-family: "SimSun", "Songti SC", "Courier New", monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        /* 动态不规则墨迹染黑图层 */
        .ink-overlay-svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 50;
            filter: drop-shadow(0 0 20px #0c0808);
        }

        .ink-blob {
            fill: #080606;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.is-destroyed .ink-blob {
            opacity: 1;
        }

        /* 全局彻底压暗背景 */
        .global-darkness {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #060404;
            pointer-events: none !important;
            z-index: 40;
            opacity: 0;
            transition: opacity 2.8s ease 0.4s;
        }

        body.is-destroyed .global-darkness {
            opacity: 1;
        }

        /* 小票容器 */
        .ticket-container {
            width: 310px;
            height: 530px;
            z-index: 100;
            position: relative;
            pointer-events: auto;
        }

        /* 正面热敏纸小票 */
        .ticket-face {
            width: 100%;
            height: 100%;
            background-color: #FAFAFA;
            padding: 1.5rem 1.2rem;
            color: #111111;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: background-color 2.5s ease, filter 2.5s ease, box-shadow 2.5s ease;

            /* 底部锯齿 */
            mask-image: radial-gradient(circle 4px at 8px bottom, transparent 100%, black 100%);
            mask-size: 16px 100%;
            mask-repeat: repeat-x;
        }

        /* 点击后小票纸张暗沉发黄 */
        body.is-destroyed .ticket-face {
            background-color: #4a453f;
            color: #111111;
            box-shadow: 0 20px 60px rgba(0,0,0,0.95);
            filter: contrast(110%) brightness(70%);
        }

        /* 小票字迹与小熊图案淡化 */
        .receipt-content {
            transition: opacity 2s ease, filter 2s ease;
            pointer-events: none;
        }

        body.is-destroyed .receipt-content {
            opacity: 0.25;
            filter: blur(0.6px) grayscale(90%);
        }

        .receipt-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }

        .dashed-line {
            border-bottom: 1px dashed #222222;
            margin: 0.6rem 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }

        .table-header, .item-row {
            display: grid;
            grid-template-columns: 2.2fr 1fr 0.8fr 1.2fr;
            font-size: 0.82rem;
            text-align: right;
            margin-bottom: 0.4rem;
        }

        .table-header {
            font-weight: bold;
        }

        .table-header span:first-child,
        .item-row span:first-child {
            text-align: left;
        }

        .bear-section {
            text-align: center;
            margin-top: 0.3rem;
        }

        .hand-drawn-bear {
            width: 95px;
            height: 95px;
            margin: 0 auto;
            display: block;
        }

.receipt-footer-text {
    font-size: 1.4rem; /* 草书笔画连贯，建议比普通文字调大 20%-30% */
    text-align: center;
    letter-spacing: 1px;
    font-family: 'Ma Shan Zheng', 'STXingkai', cursive;
}
        .click-hint {
            font-size: 0.65rem;
            color: #888888;

            margin-top: 0.4rem;
            transition: opacity 0.5s ease;
        }

        body.is-destroyed .click-hint {
            opacity: 0;

        /* ------------------ 醒目的交叉查封封条 ------------------ */
        .seal-strip {
            position: absolute;
            background-color: #f7f3e8;
            color: #b30000;
            border: 3px solid #b30000;
            font-family: 'SimSun', 'Songti SC', serif;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transform: scale(1.2);
            transition: opacity 1.2s ease 0.6s, transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s;
        }

        body.is-destroyed .seal-strip {
            opacity: 0.96;
            transform: scale(1);
        }

        .seal-strip-1 {
            width: 140%;
            height: 52px;
            top: 35%;
            left: -20%;
            transform: rotate(-22deg) scale(1.2);
        }

        body.is-destroyed .seal-strip-1 {
            transform: rotate(-22deg) scale(1);
        }

        .seal-strip-2 {
            width: 140%;
            height: 46px;
            top: 42%;
            left: -20%;
            transform: rotate(18deg) scale(1.2);
        }

        body.is-destroyed .seal-strip-2 {
            transform: rotate(18deg) scale(1);
        }

        .seal-title {
            font-size: 1.25rem;
            letter-spacing: 8px;
            line-height: 1.1;
        }

        .seal-date {
            font-size: 0.6rem;
            color: #333;
            letter-spacing: 1px;
            margin-top: 1px;
        }

    <script>
        function triggerDestroy(event) {
            if (document.body.classList.contains('is-destroyed')) return;
            
            document.body.classList.add('is-destroyed');

            const clickX = event.clientX;
            const clickY = event.clientY;
            const inkPath = document.getElementById('inkPath');

            // 动态生成不规则多边形节点（模拟墨水侵蚀边缘）
            const pointCount = 14;
            const baseAngles = [];
            for (let i = 0; i < pointCount; i++) {
                baseAngles.push((i * 2 * Math.PI) / pointCount);
            }

            const startTime = performance.now();
            const duration = 2200;
            const maxRadius = Math.max(window.innerWidth, window.innerHeight) * 1.5;

            function generateIrregularPath(progress) {
                let d = "";
                for (let i = 0; i < pointCount; i++) {
                    const angle = baseAngles[i];
                    // 引入伪随机波动，构建 jagged/organic 边缘
                    const noise = Math.sin(i * 3.7 + progress * 5) * 0.35 + 1;
                    const r = progress * maxRadius * noise;
                    
                    const x = clickX + r * Math.cos(angle);
                    const y = clickY + r * Math.sin(angle);

                    if (i === 0) {
                        d += `M ${x} ${y} `;
                    } else {
                        // 使用 Q 贝塞尔曲线平滑连接不规则顶点
                        const prevAngle = baseAngles[i - 1];
                        const midAngle = (angle + prevAngle) / 2;
                        const midR = r * 1.15;
                        const cx = clickX + midR * Math.cos(midAngle);
                        const cy = clickY + midR * Math.sin(midAngle);
                        d += `Q ${cx} ${cy} ${x} ${y} `;
                    }
                }
                d += "Z";
                return d;
            }

            function animateInk(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // 缓动函数
                const easeProgress = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                inkPath.setAttribute('d', generateIrregularPath(easeProgress));

                if (progress < 1) {
                    requestAnimationFrame(animateInk);
                }
            }

            requestAnimationFrame(animateInk);
        }
    </script>
