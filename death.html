<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>退信信封</title>
    <!-- 引入毛笔/书法手写字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "SimSun", "Songti SC", "STSong", serif;
            background-color: #121212;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2002年标准牛皮纸信封 */
        .envelope-card {
            width: 220mm;
            height: 110mm;
            background-color: #c7a776;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.2) 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 4px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.7),
                inset 0 0 20px rgba(80, 45, 10, 0.35),
                inset 0 0 2px rgba(255, 255, 255, 0.5);
            border-radius: 2px;
            padding: 12mm 15mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            border: 1px solid #9e8055;
        }

        /* 邮政编码框 */
        .zip-container {
            position: absolute;
            top: 10mm;
            left: 12mm;
            display: flex;
            gap: 2mm;
        }

        .zip-box {
            width: 6.5mm;
            height: 8.5mm;
            border: 1.5px solid #c82424;
            color: #c82424;
            font-family: "Courier New", monospace;
            font-size: 17px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 邮票区 */
        .stamp-box {
            position: absolute;
            top: 10mm;
            right: 12mm;
            width: 26mm;
            height: 32mm;
            background: #fbf8f0;
            border: 1px dashed #b5a48b;
            padding: 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .stamp-border {
            width: 100%;
            height: 100%;
            border: 1px solid #a02020;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 2px;
            box-sizing: border-box;
        }

        .stamp-head {
            font-size: 8px;
            color: #a02020;
            font-family: "SimSun", serif;
            letter-spacing: 1px;
        }

        .stamp-main {
            font-size: 15px;
            color: #22422b;
            font-weight: bold;
        }

        .stamp-val {
            font-size: 11px;
            color: #a02020;
            font-weight: bold;
            font-family: "Courier New", monospace;
        }

        /* 邮局投递邮戳 */
        .postmark {
            position: absolute;
            top: 12mm;
            right: 22mm;
            width: 38mm;
            height: 38mm;
            border: 1.5px solid #a82424;
            border-radius: 50%;
            color: #a82424;
            opacity: 0.85;
            transform: rotate(-18deg);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "SimSun", serif;
            font-size: 10px;
        }

        .postmark-inner {
            width: 92%;
            height: 92%;
            border: 1px solid #a82424;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .postmark-line {
            width: 100%;
            border-top: 1px solid #a82424;
            margin: 2px 0;
        }

        /* 信封原寄件抬头 */
        .original-address {
            position: absolute;
            top: 25mm;
            left: 20mm;
            font-family: 'Ma Shan Zheng', "KaiTi", cursive;
            font-size: 18px;
            color: #5c4a37;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* 顾兆元直接用朱墨批在信封正面的手写字体 */
        .father-handwriting {
            position: absolute;
            top: 18mm;
            left: 30mm;
            width: 145mm;
            height: 75mm;
            color: #580606; /* 浓重的朱墨色 */
            font-family: 'Ma Shan Zheng', 'Zhi Mang Xing', 'KaiTi', cursive;
            font-size: 22px;
            line-height: 1.5;
            transform: rotate(-1.8deg);
            text-shadow: 0.3px 0.3px 0px #580606;
            box-sizing: border-box;
            z-index: 5;
        }

        .hand-line-1 {
            font-size: 25px;
            margin-bottom: 4px;
            letter-spacing: 3px;
        }

        .hand-line-2 {
            text-indent: 1.8em;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .hand-line-3 {
            text-indent: 1.8em;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .hand-line-4 {
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            letter-spacing: 4px;
            padding-right: 8mm;
        }

        /* 核心修改：邮局【拒收退回】双圈圆形印章 */
        .round-return-stamp {
            position: absolute;
            bottom: 8mm;
            left: 15mm;
            width: 42mm;
            height: 42mm;
            border: 2px solid #b81c1c;
            border-radius: 50%;
            color: #b81c1c;
            transform: rotate(12deg);
            background: rgba(199, 167, 118, 0.4);
            pointer-events: none;
            box-sizing: border-box;
            padding: 2px;
            z-index: 10;
        }

        .round-stamp-inner {
            width: 100%;
            height: 100%;
            border: 1px solid #b81c1c;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            box-sizing: border-box;
            font-family: "SimSun", "Songti SC", serif;
        }

        .stamp-top-text {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stamp-center-text {
            font-family: "SimHei", "STHeiti", sans-serif;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 3px;
            border-top: 1px solid #b81c1c;
            border-bottom: 1px solid #b81c1c;
            width: 90%;
            text-align: center;
            padding: 1px 0;
            color: #b81c1c;
        }

        .stamp-bottom-text {
            font-size: 9px;
            transform: scale(0.9);
        }

        /* 折痕 */
        .crease-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.06), transparent);
            pointer-events: none;
        }

        /* 操作按钮 */
        .btn-container {
            position: fixed;
            top: 20px;
            right: 20px;
        }

        .btn-print {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-print:hover {
            background-color: #555;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .btn-container {
                display: none;
            }
            .envelope-card {
                box-shadow: none;
            }
        }
   .progress-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            z-index: 9999;
        }
    </style>
    <div class="progress-indicator">extra5/31</div>
</head>
<body>

    <div class="btn-container">
    </div>

    <!-- 2002年牛皮纸信封 -->
    <div class="envelope-card">
        
        <div class="crease-line"></div>

        <!-- 邮政编码框 -->
        <div class="zip-container">
            <div class="zip-box">4</div>
            <div class="zip-box">0</div>
            <div class="zip-box">4</div>
            <div class="zip-box">4</div>
            <div class="zip-box">0</div>
            <div class="zip-box">4</div>
        </div>

        <!-- 80分邮票 -->
        <div class="stamp-box">
            <div class="stamp-border">
                <span class="stamp-head">中国邮政</span>
                <span class="stamp-main">黄山迎客松</span>
                <span class="stamp-val">80分</span>
            </div>
        </div>

        <!-- 2002年邮局投递邮戳 -->
        <div class="postmark">
            <div class="postmark-inner">
                <div>临渊 凛州</div>
                <div class="postmark-line"></div>
                <div>2003.4.18</div>
                <div class="postmark-line"></div>
                <div>投递 04</div>
            </div>
        </div>

        <!-- 信封原寄件抬头 -->
        <div class="original-address">
            寄：父亲尊启
        </div>

        <!-- 顾兆元直接用朱墨写在信封正面的手写体批语 -->
        <div class="father-handwriting">
            <div class="hand-line-1">立身以贞为本。</div>
            <div class="hand-line-2">夫亡未久，既已改嫁，便安心过自己的日子，不必再以家事为念。</div>
            <div class="hand-line-3">你既已作此选择，往后的路，便好自珍重。求生易，求名难。望你日后自守，莫负自己。</div>
            <div class="hand-line-4">原信退回。</div>
        </div>

        <!-- 圆形【收件人拒收·原件退回】邮局戳章 -->
        <div class="round-return-stamp">
            <div class="round-stamp-inner">
                <div class="stamp-top-text">中国邮政投递</div>
                <div class="stamp-center-text">拒 收</div>
                <div class="stamp-bottom-text">退回寄件人</div>
            </div>
        </div>

    </div>

</body>
</html>
